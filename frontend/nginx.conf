server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hardening-review finding: no security response headers were set
    # anywhere (backend or here), and it wasn't a documented, deliberate
    # deferral to a reverse-proxy layer either — see the matching
    # `security_headers_middleware` in backend/app/main.py for the same
    # conservative rationale (clickjacking protection only; a full CSP
    # restricting script/style sources is left as a documented follow-up
    # to avoid shipping one unverified against this SPA's actual needs).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        try_files $uri /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
