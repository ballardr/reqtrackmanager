# The search page keeps what was searched for in its URL (/search?q=...) so a search can be shared and
# reached with Back. A person may paste anything into a search box, and these logs are shipped to Loki, so
# the access log records the path only: `$uri` (never `$request`, `$request_uri` or `$args`) and the
# referring page's path (a navigation from /search?q=... carries that URL in the Referer header).
# HSTS only on a request the proxy in front says arrived over HTTPS (an empty value omits the header), so a plain-HTTP
# development stack is never told to insist on HTTPS.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https "max-age=31536000; includeSubDomains";
}

map $http_referer $referer_path {
    default "";
    "~^(?<path>[^?#]*)" $path;
}

log_format path_only '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$referer_path" "$http_user_agent"';

server {
    listen 3000;
    # Both families: the IPv6 listener must stay (see CLAUDE.md, "IPv6 Support").
    listen [::]:3000;
    server_name _;
    access_log /dev/stdout path_only;
    root /usr/share/nginx/html;
    index index.html;

    # Security response headers. nginx drops every `add_header` of the server block in a location that has one of its
    # own, so the whole set lives in `security-headers.inc` and a location that adds a header includes it again.
    # The Content-Security-Policy is built when the container starts (`docker/env-config-entrypoint.sh`) because it
    # depends on the deployment: the API origin, the optional single-page-app module origins and analytics host.
    include /etc/nginx/security-headers.inc;

    location / {
        include /etc/nginx/security-headers.inc;
        # The page itself is never reused without asking the server (a new build changes the hashed file names it
        # names); the hashed files under /assets/ below are immutable.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Tier C ("federated" / Module Federation) frontend modules — module
    # system follow-up, 2026-09-07. A self-hosted operator who builds a
    # third-party module's own Module Federation remote bundle mounts it
    # here (bind-mount a volume at this path onto the running container —
    # see docs/deployment.md's "Adding a Tier C (federated) frontend
    # module") so the frontend can `import()` its `remoteEntry.js` at
    # runtime with no rebuild of this image at all. Served same-origin,
    # deliberately, rather than only documenting "point remote_entry_url at
    # wherever you like" — so that *this* deployment pattern (unlike an
    # operator who instead points a module's `remote_entry_url` at an
    # externally-hosted origin, which remains supported) is automatically
    # covered by a future `script-src 'self'` with no allowlist entry
    # needed, the instant the CSP follow-up named just above gets built.
    # Empty by default (a reserved, normally-empty directory) — a
    # deployment that never enables a Tier C module never has anything to
    # serve here.
    #
    # FORWARD-POINTING NOTE for whoever builds the "full CSP restricting
    # script/style sources" follow-up named in the comment above: a
    # `script-src` directive must allow `'self'` (which already covers this
    # location) for the same-origin deployment pattern to keep working, and
    # must separately allowlist any origin an operator has instead pointed
    # a Tier C module's `remote_entry_url` at directly (the
    # externally-hosted alternative) — unlike Tier B's `frame_url`, there is
    # no `MODULE_FRAME_ALLOWED_ORIGINS`-equivalent backend-enforced
    # allowlist for Tier C to derive that second case from mechanically; see
    # `backend/app/modules/registry.py`'s `ModuleFrontendManifest.
    # remote_entry_url` docstring for why that omission is deliberate, not
    # an oversight.
    location /external-modules/ {
        alias /usr/share/nginx/external-modules/;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        # A 404 for a module not yet mounted must not fall through to the
        # SPA's own `try_files ... /index.html` catch-all above (which
        # would return `index.html` with a 200, silently breaking the
        # dynamic `import()` that requested it) — this location's own
        # default `try_files $uri =404` behaviour (no `try_files`
        # directive at all) is exactly what's wanted here, unlike `location
        # /` above.
    }

    location = /health {
        include /etc/nginx/security-headers.inc;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
