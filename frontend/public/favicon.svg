<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Default static favicon (Task: "Login page shows no logo" follow-up gap —
  no favicon existed anywhere in the repo). Derived from
  frontend/src/assets/logo.svg (the same mark used in Layout.tsx's header
  and, as of this change, LoginBrandHeader's fallback) rather than inventing
  a new mark, so the browser tab matches the in-app branding. The logo's
  strokes/fills are white-on-transparent (designed to sit on the app
  header's dark background, --color-header-bg #14161c in theme.css), so a
  matching dark rounded-square background is added here — an SVG favicon
  rendered directly on a light browser toolbar would otherwise be
  invisible. Not admin-configurable (out of scope per the task); see
  frontend/index.html for the <link rel="icon"> tags and favicon.ico for
  the non-SVG fallback.
-->
