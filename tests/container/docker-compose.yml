# Local development / test stack: db + storage + mailhog + backend + frontend.
# This is the stack used to develop locally, to run the backend pytest suite,
# and to run the Playwright end-to-end suite — it is NOT the production
# stack (see the root docker-compose.yml for that). Keeping this stack
# entirely separate, in its own Compose project (directory-derived project
# name "container", distinct from the root project), means:
#   - its Postgres database is always `reqtrack_test`, never the real `reqtrack`
#     database a production/root-stack deployment would use, so running
#     tests here can never collide with or destroy real data (see
#     docs/decisions.md, "Database: the test suite was wiping the live
#     database").
#   - it can be brought up/down/rebuilt independently of any root stack
#     running on the same machine, since Compose scopes volumes and networks
#     per project.
#
# `backend`'s DATABASE_URL below points this container's own long-running app
# process (the dev/demo stack this stack is also used to manually run, and
# the backend Playwright targets) at `reqtrack_test` on the `db` service.
# `docker compose exec backend pytest -q` does NOT run against that same
# `reqtrack_test` database, even though it execs into this same container:
# `backend/tests/conftest.py` unconditionally rewrites DATABASE_URL's
# database name to a second, pytest-only database (`reqtrack_pytest_test`,
# created automatically on the same `db` server/container the first time
# it's needed) before any test runs. This is deliberate — pytest's fixtures
# drop/recreate the whole schema every session and truncate every table
# after every test, which is safe for its own dedicated database but would
# otherwise repeatedly destroy manually-seeded demo/dev data in
# `reqtrack_test` every time `pytest` ran (see docs/decisions.md's entry on
# this, and `backend/tests/conftest.py`'s own module docstring for the full
# incident this fixes). `reqtrack_test` itself is left exclusively to this
# container's own app process and to Playwright.
#
# Usage:
#   cd tests/container && docker compose up --build -d
#   docker compose exec backend pytest -q   # runs against reqtrack_pytest_test, NOT reqtrack_test
#   cd ../../tests/playwright && npx playwright test   # targets reqtrack_test via the backend service above
services:
  db:
    image: postgres:16-alpine
    # The schema is large enough (hundreds of relations) that the pytest session fixture's
    # `DROP SCHEMA public CASCADE`, run by four xdist workers at once, exhausts the default
    # 64 locks per transaction ("out of shared memory") and errors every test.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_DB: reqtrack_test
      POSTGRES_USER: reqtrack
      POSTGRES_PASSWORD: reqtrack
    volumes:
      - reqtrack_test_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqtrack -d reqtrack_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for the backend's STORAGE_BACKEND=s3 mode.
  # This used to be MinIO, but MinIO discontinued anonymous/free pulls of
  # its own images from both Docker Hub (repos deleted 2026-09-11) and
  # quay.io (anonymous pulls cut off 2026-09-24) — see docs/decisions.md,
  # "Storage backend: MinIO images no longer pullable, replaced with
  # SeaweedFS". SeaweedFS's S3 gateway is a verified drop-in replacement for
  # the plain head_bucket/create_bucket/put_object/get_object/delete_object
  # calls `backend/app/storage_backends/s3.py` makes (no presigned URLs,
  # multipart, versioning, or MinIO Admin API in use anywhere in the app),
  # and it is configured with ONE S3 identity (STORAGE_ACCESS_KEY /
  # STORAGE_SECRET_KEY) that may act on the application bucket only, with
  # everything except the S3 gateway on loopback — the same as the production
  # stack (see docs/deployment.md, "Storage credential scope"). There's no
  # bundled admin console UI in this replacement (SeaweedFS has no equivalent
  # to MinIO's `:9001` console) — see docs/deployment.md's storage backend
  # section for how to inspect bucket contents without one.
  storage:
    image: chrislusf/seaweedfs:3.97
    container_name: reqtrack-test-storage
    # No disk preallocation: SeaweedFS otherwise reserves ~1 GB per volume (35 volumes held 35 GB for 5 MB of data).
    command: >-
      server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1
      -s3 -s3.port=9000 -s3.ip.bind=:: -s3.config=/etc/seaweedfs/s3.json
      -master.volumePreallocate=false
    configs:
      - source: storage_identity
        target: /etc/seaweedfs/s3.json
    volumes:
      - reqtrack_test_storage_data:/data
    ports:
      - "9000:9000"
    healthcheck:
      # The S3 API's own /healthz is broken in this image (returns 404 —
      # it's parsed as a bucket name; see seaweedfs#8243), so this checks
      # the master's cluster-status endpoint (loopback only) and that the S3
      # gateway answers (403 without credentials). wget, not curl — this
      # image has no curl binary.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status && wget -S -qO- http://127.0.0.1:9000/ 2>&1 | grep -q 'HTTP/1.1 403'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # Real OIDC identity provider used to test the SSO login flow end-to-end
  # (Massif v3, E-U-01) — see tests/container/keycloak/realm-export.json for
  # the realm/client/test-user configuration, and
  # tests/playwright/tests/e2e-workflows/sso.spec.ts for the spec that
  # drives a real login through this instance's own login form.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Keycloak always advertises this as its issuer/endpoint host in
      # discovery documents and issued tokens, regardless of which hostname
      # a caller actually used to reach it (KC_HOSTNAME_STRICT=false) — this
      # is what makes the split browser-vs-backend addressing below work:
      # the browser is redirected to http://localhost:8080/..., matching
      # this setting, while the backend itself reaches this same container
      # via the internal http://keycloak:8080 (see backend's
      # OIDC_INTERNAL_BASE_URL_OVERRIDE below).
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 3 cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ../../backend
    environment:
      # Worker processes (CPU cores the API can use); see backend/docker-entrypoint.sh.
      BACKEND_WORKERS: ${BACKEND_WORKERS:-4}
      DATABASE_URL: postgresql://reqtrack:reqtrack@db:5432/reqtrack_test
      # Fixed values only for the local test stack; the demonstration (scripts/demo.sh) generates its own and
      # turns REQUIRE_STRONG_SECRETS on, so a published name never runs on these.
      JWT_SECRET: ${JWT_SECRET:-test-secret-not-for-production}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:-test-encryption-key-not-for-production}
      REQUIRE_STRONG_SECRETS: ${REQUIRE_STRONG_SECRETS:-false}
      # The seeds and the Playwright suite sign in as accounts whose passwords the seed typed; production forces a change.
      FORCE_PASSWORD_CHANGE_ON_ADMIN_SET: ${FORCE_PASSWORD_CHANGE_ON_ADMIN_SET:-false}
      # Every suite sign-in comes from one address and the Playwright suite signs in hundreds of times, some with a wrong
      # password on purpose, so the per-address allowance (30 failures in 15 minutes) would delay later sign-ins with a 429.
      # The per-account delay stays at its default.
      LOGIN_DELAY_FREE_ATTEMPTS_ADDRESS: ${LOGIN_DELAY_FREE_ATTEMPTS_ADDRESS:-100000}
      REQUIRE_EMAIL_CONFIRMATION: ${REQUIRE_EMAIL_CONFIRMATION:-false}
      SERVER_ADMIN_ENABLED: "true"
      SERVER_ADMIN_EMAIL: ${SERVER_ADMIN_EMAIL:-admin@example.com}
      SERVER_ADMIN_PASSWORD: ${SERVER_ADMIN_PASSWORD:-ChangeMe123!}
      SERVER_ADMIN_CREATE_ORG: "true"
      # The Playwright suite is written against each module's own opt-in default, so a fresh
      # test database must not be seeded with every module available.
      MODULES_DEFAULT_AVAILABLE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-reqtrackmanager}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-http://storage:9000}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-reqtrackapp}
      STORAGE_S3_SECRET_KEY: ${STORAGE_SECRET_KEY:-reqtrackapp}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # An organisation's own SMTP relay must resolve to a public address by default; the suite points one at
      # this stack's MailHog, which is on the private Docker network.
      ORG_SMTP_ALLOW_PRIVATE_NETWORK_TARGETS: "true"
      DEPLOYMENT_NOTIFICATION_EMAIL: ${DEPLOYMENT_NOTIFICATION_EMAIL:-}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      MCP_SERVER_PUBLIC_URL: ${MCP_SERVER_PUBLIC_URL:-http://localhost:8100}
      # The header Help link opens this stack's own `docs` service (below), not the public site.
      HELP_URL: ${HELP_URL:-http://localhost:3001/reqtrackmanager/}
      # See keycloak service's comment above: the backend reaches Keycloak
      # over the Docker-internal network, but every org's oidc_issuer_url is
      # configured with Keycloak's browser-facing public URL
      # (http://localhost:8080/realms/...) since that's what must appear in
      # tokens and what the browser gets redirected to.
      OIDC_INTERNAL_BASE_URL_OVERRIDE: http://keycloak:8080
      # EPS and PDF logos are converted by the `converter` service (below), which the real-conversion tests also use.
      REPORT_CONVERTER_URL: http://converter:8300
      # One extra font (a renamed copy of the bundled Liberation Mono) so the Report fonts page has a family to show.
      REPORT_FONTS_DIR: /app/report-fonts
    volumes:
      - ./report-fonts:/app/report-fonts:ro
      # The demonstration command's state (a rotated password) and status (reset metrics): shared with the
      # demo-scheduler service, so a manual and a scheduled reset see the same files.
      - reqtrack_demo_state:/demo/state
      - reqtrack_demo_status:/demo/status
    networks:
      - default
      - converter
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      converter:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      start_period: 120s
      timeout: 5s
      retries: 10

  # Picture converter: runs Ghostscript and poppler on uploaded EPS and PDF logos so the backend never does
  # (docs/solution-architecture.md). It is the sandbox: only on the `converter`
  # network, which is `internal` (no route out, no published port) and shared with the backend alone; no secrets and
  # no application code; non-root, read-only root filesystem with a small scratch `tmpfs`, no Linux capabilities, and
  # CPU, memory and process ceilings. Nothing is stored.
  converter:
    build:
      context: ../../converter
    networks:
      - converter
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2560m
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=4)"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
    environment:
      # No colon in ${PUBLIC_API_BASE_URL-...} — see the same note in the
      # root docker-compose.yml; preserves an explicitly-empty value rather
      # than treating it as unset.
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL-http://localhost:8000}
      # Origins the Content-Security-Policy allows beyond this site (frontend/docker/env-config-entrypoint.sh):
      # single-page-app module origins and sandboxed module frames. The frame list is the backend's own allow-list.
      CSP_SCRIPT_SRC_EXTRA: ${CSP_SCRIPT_SRC_EXTRA:-}
      MODULE_FRAME_ALLOWED_ORIGINS: ${MODULE_FRAME_ALLOWED_ORIGINS:-}
      # Optional Microsoft Clarity project id for a demonstration (scripts/demo.sh --clarity <id>); empty loads nothing.
      CLARITY_PROJECT_ID: ${DEMO_CLARITY_PROJECT_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    # See the root docker-compose.yml's frontend service for the full
    # explanation — Tier C (Module Federation) frontend module support,
    # module system follow-up, 2026-09-07. Uncomment to test a Tier C
    # module against this dev/test stack.
    # volumes:
    #   - ./external-modules:/usr/share/nginx/external-modules:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  # Daily demonstration reset (docs/development.md, "Demonstration"): the backend image running
  # `demo_setup.py schedule`, so the demonstration data is removed and seeded again at DEMO_RESET_AT in
  # DEMO_RESET_TZ. Not started by default; use `docker compose --profile demo-schedule up -d demo-scheduler`.
  # A host with cron or systemd can run `demo_setup.py --demo --reset` instead; do not run both. It is a
  # separate opt-in service, not a backend job, so a deployment cannot reset itself by accident. Every run
  # applies the same guards as a manual reset.
  demo-scheduler:
    extends:
      service: backend
    profiles: ["demo-schedule"]
    entrypoint: ["python", "scripts/demo_setup.py"]
    command: ["schedule"]
    ports: !reset []
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      DEMO_MODE: "1"
      DEMO_API_BASE: http://backend:8000/api/v1
      DEMO_RESET_AT: ${DEMO_RESET_AT:-00:00}
      DEMO_RESET_TZ: ${DEMO_RESET_TZ:-UTC}
      DEMO_ROTATE_PASSWORDS: ${DEMO_ROTATE_PASSWORDS:-}
      DEMO_ALLOW_UPLOADS: ${DEMO_ALLOW_UPLOADS:-}
      DEMO_CONFIRM_DATABASE: ${DEMO_CONFIRM_DATABASE:-}
    depends_on:
      backend:
        condition: service_healthy

  # Usage metrics for a demonstration (docs/demo.md, "Usage metrics"): scripts/demo.sh starts it (profile
  # demo-metrics) and `--export-metrics` bundles what it collected. Scrapes the backend only. Samples are kept for
  # 30 days (and at most 2 GB) in a named volume that a demonstration reset leaves alone. The admin API is enabled
  # for the bundle's snapshot, so the port is published on the loopback address only and the listener also takes IPv6.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["demo-metrics"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-admin-api
      - --web.listen-address=[::]:9090
    volumes:
      - ../../observability/prometheus.demo.yml:/etc/prometheus/prometheus.yml:ro
      - reqtrack_demo_metrics:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

  # See the root docker-compose.yml's mcp-server service for the full
  # explanation — same service, dev/test defaults.
  mcp-server:
    build:
      context: ../../mcp-server
    environment:
      REQTRACK_API_URL: http://backend:8000
      REQTRACK_PUBLIC_API_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
      # On by default in the dev/test stack so the write tools (and their
      # test coverage) are actually exercised — see docs/mcp-server.md's
      # "Write mode" section. The production stack below defaults this off.
      MCP_WRITES_ENABLED: ${MCP_WRITES_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8100/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  # Local preview of docs/website/ (Docusaurus).
  # Port 3001 (not 3000, already taken by
  # `frontend` above). No `depends_on`: unlike every other service in this
  # stack, the docs site is fully static and built entirely from files in
  # docs/website/ — it neither calls nor is called by db/backend/frontend/
  # anything else here, so it can be brought up in isolation
  # (`docker compose up --build -d docs`) without any of them running.
  # Dev/eval-only, like the rest of this stack — the real, public docs site
  # is what GitHub Pages serves once the `docs-deploy` CI job runs against
  # `main` (see docusaurus.config.ts's `url`/`baseUrl`, hence the
  # /reqtrackmanager/ prefix on the URLs below matching that same path
  # locally).
  docs:
    build:
      context: ../../docs/website
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/reqtrackmanager/"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

# The one S3 identity the bundled storage accepts, restricted to the application
# bucket (Admin lets it create that bucket on first start, as the backend does).
configs:
  storage_identity:
    content: |
      {"identities":[{"name":"app",
        "credentials":[{"accessKey":"${STORAGE_ACCESS_KEY:-reqtrackapp}","secretKey":"${STORAGE_SECRET_KEY:-reqtrackapp}"}],
        "actions":["Admin:${STORAGE_S3_BUCKET:-reqtrackmanager}","Read:${STORAGE_S3_BUCKET:-reqtrackmanager}","Write:${STORAGE_S3_BUCKET:-reqtrackmanager}","List:${STORAGE_S3_BUCKET:-reqtrackmanager}"]}]}

# `internal`: containers on it get no route to the outside world. Only the backend and the converter join it.
networks:
  converter:
    internal: true

volumes:
  reqtrack_test_db_data:
  reqtrack_test_storage_data:
  reqtrack_demo_state:
  reqtrack_demo_status:
  reqtrack_demo_metrics:
