<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <rect width="640" height="320" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1f2933">
    <rect x="20" y="40" width="130" height="50" rx="6" fill="#e6f0ff" stroke="#0f62fe" stroke-width="2"/>
    <text x="85" y="70">GPS receiver</text>
    <rect x="20" y="135" width="130" height="50" rx="6" fill="#e6f0ff" stroke="#0f62fe" stroke-width="2"/>
    <text x="85" y="165">IMU</text>
    <rect x="20" y="230" width="130" height="50" rx="6" fill="#e6f0ff" stroke="#0f62fe" stroke-width="2"/>
    <text x="85" y="260">Barometer</text>

    <rect x="240" y="60" width="140" height="70" rx="6" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
    <text x="310" y="90">Estimator A</text>
    <text x="310" y="110">(primary)</text>
    <rect x="240" y="190" width="140" height="70" rx="6" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
