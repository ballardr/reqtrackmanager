    <g stroke="#52606d" stroke-width="2" fill="none">
      <path d="M150 65 L240 85"/>
      <path d="M150 160 L240 100"/>
      <path d="M150 160 L240 220"/>
      <path d="M150 255 L240 235"/>
      <path d="M380 95 L470 150"/>
      <path d="M380 225 L470 170"/>
    </g>
  </g>
  <text x="320" y="305" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#52606d">Dual-redundant sensor fusion with a voting stage</text>
</svg>
