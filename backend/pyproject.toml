[tool.ruff]
# 150 characters is the enforced ceiling (existing lines run up to 146), rather than the stricter 80-character guideline.
line-length = 150
target-version = "py312"

[tool.ruff.lint]
# N-E-04: a mechanical style gate, not exhaustive Google Python Style Guide enforcement. E/W (pycodestyle), F (pyflakes),
# I (import sorting), UP (modernise syntax) and B (common bug patterns) are selected; the docstring "D" rules are not
# enforced here (N-E-05 in docs/decisions.md).
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's dependency-injection idiom is exactly `Depends(...)` as an
    # argument default — this rule exists to catch a general Python
    # anti-pattern (mutable default arguments) that doesn't apply here.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# Static type check of the application package (`mypy` from backend/). The package has no findings and
# `scripts/check_mypy.py` fails on any, so a new one is fixed in the code, never ignored or baselined.
python_version = "3.12"
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# These libraries ship no stubs and no `py.typed`, and no stub package exists for them: APScheduler 3.x and
# `mathml2omml` (one function, `convert`, used by `services.report_math`) and `cssselect2` (the selector engine of
# `services.svg_styles`; its sibling `tinycss2` has the `types-tinycss2` stubs).
module = ["apscheduler.*", "mathml2omml.*", "cssselect2.*"]
ignore_missing_imports = true
