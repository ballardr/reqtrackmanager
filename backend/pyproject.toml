[tool.ruff]
# The codebase's existing lines run up to 146 chars; 150 is set as the
# enforced ceiling so this gate catches genuinely new drift without
# requiring a disruptive one-off reformat of already-written code to the
# stricter 80-char Google guideline.
line-length = 150
target-version = "py312"

[tool.ruff.lint]
# N-E-04: a mechanical style gate, not exhaustive Google Python Style Guide
# enforcement. E/W (pycodestyle), F (pyflakes), I (import sorting), UP
# (modernise syntax), B (common bug patterns) catch real drift; full
# docstring coverage (the "D" rules) is intentionally not enforced here —
# see N-E-05 in docs/decisions.md for why that's a separate, narrower pass
# rather than a repo-wide mechanical gate.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's dependency-injection idiom is exactly `Depends(...)` as an
    # argument default — this rule exists to catch a general Python
    # anti-pattern (mutable default arguments) that doesn't apply here.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# Static type check of the application package (`mypy` from backend/). Existing findings are
# recorded in `mypy_baseline.json` and `scripts/check_mypy.py` fails on any finding not in it, so
# the debt can only shrink (a finding is removed from the baseline as it is fixed).
python_version = "3.12"
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# These libraries ship no stubs and no `py.typed`, and no stub package exists for them: APScheduler 3.x and
# `mathml2omml` (one function, `convert`, used by `services.report_math`).
module = ["apscheduler.*", "mathml2omml.*"]
ignore_missing_imports = true
