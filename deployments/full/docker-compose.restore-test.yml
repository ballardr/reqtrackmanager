# Override for an ISOLATED copy of the stack: the disaster-recovery restore-test (scripts/restore-test.sh) and
# its self-check (scripts/restore-test-selfcheck.sh) run `docker compose -p <throwaway project> -f
# deployments/full/docker-compose.yml -f deployments/full/docker-compose.restore-test.yml`. The project cannot
# collide with, or reach, a running deployment:
#   - no published ports (the checks run inside the containers);
#   - no fixed container name (the base file names the storage container, which a second project cannot reuse);
#   - email delivery disabled in the application (a mistyped SMTP host could otherwise send real mail);
#   - a patient health check: the application, database and restore share one small host, so the backend gets
#     minutes, not seconds, to answer;
#   - the bootstrap server administrator is off by default: it adds a user the backup does not hold, so the
#     restored statistics would not match. The self-check turns it on for the source stack it seeds;
#   - an administrator-typed password forces a change at first sign-in by default; the self-check turns that off
#     for the source stack so the seed can sign in as the accounts it creates;
#   - object storage without disk preallocation: SeaweedFS reserves about 1 GB for each of the first seven volumes
#     at the first upload (5 to 15 GB for a throwaway stack). The flag below stops the reservation only.
# The restore-test also writes a second, generated override that mounts the repository read-only (see
# docs/disaster-recovery.md, "Restore test").
services:
  storage:
    container_name: !reset null
    command: >-
      server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1
      -s3 -s3.port=9000 -s3.ip.bind=:: -s3.config=/etc/seaweedfs/s3.json
      -master.volumePreallocate=false
  backend:
    ports: !reset []
    environment:
      EMAIL_DELIVERY: ${RESTORE_TEST_EMAIL_DELIVERY:-disabled}
      SERVER_ADMIN_ENABLED: ${RESTORE_TEST_SERVER_ADMIN_ENABLED:-false}
      FORCE_PASSWORD_CHANGE_ON_ADMIN_SET: ${RESTORE_TEST_FORCE_PASSWORD_CHANGE_ON_ADMIN_SET:-true}
    healthcheck:
      start_period: 300s
      retries: 30
