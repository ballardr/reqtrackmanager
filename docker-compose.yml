# Production-oriented stack: db + storage + backend + frontend, plus an
# optional observability profile. This is what a real deployment runs (see
# docs/deployment.md) — it intentionally does NOT include MailHog (a
# dev/test-only SMTP catcher) or a test database. Local development and all
# automated testing (backend pytest, Playwright) use the separate stack at
# tests/container/docker-compose.yml instead, which is deliberately isolated
# from this one (see docs/decisions.md, "Database: the test suite was
# wiping the live database").
#
# Before running this in production, override at minimum JWT_SECRET,
# APP_SECRET_ENCRYPTION_KEY, SERVER_ADMIN_PASSWORD, STORAGE_SECRET_KEY, CORS_ORIGINS, and the
# SMTP_* variables via a `.env` file — see docs/deployment.md.
#
# backend/frontend/mcp-server each declare both `image:` and `build:`.
# `image:` names the same picture .github/workflows/ci.yml pushes to
# ghcr.io on every merge to main (a multi-arch manifest for linux/amd64 and
# linux/arm64, so a pull on a Raspberry Pi or Apple-silicon host gets the
# right image; tagged with GitVersion's SemVer, the commit SHA, and `latest`) — set IMAGE_TAG in your `.env` to pin a specific
# released version instead of always tracking `latest`, then
# `docker compose pull && docker compose up -d` to deploy it without
# building anything locally. `build:` is what `docker compose up --build`
# (or a plain `up`/`pull` when no matching image exists yet, e.g. before the
# first release) falls back to, so this file is still fully self-contained
# without ever touching ghcr.io. See docs/deployment.md's "Obtaining
# container images" section.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reqtrack
      POSTGRES_USER: reqtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in production}
    volumes:
      - reqtrack_db_data:/var/lib/postgresql/data
    # No host port published: nothing outside the Compose network needs
    # direct Postgres access in production. `scripts/backup.sh`/`restore.sh`
    # and manual psql access all go through `docker compose exec db ...`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqtrack -d reqtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for the backend's STORAGE_BACKEND=s3 mode.
  # This used to be MinIO, but MinIO discontinued anonymous/free pulls of
  # its own images from both Docker Hub (repos deleted 2026-09-11) and
  # quay.io (anonymous pulls cut off 2026-09-24) — see docs/decisions.md,
  # "Storage backend: MinIO images no longer pullable, replaced with
  # SeaweedFS". SeaweedFS's S3 gateway is a verified drop-in replacement for
  # the plain head_bucket/create_bucket/put_object/get_object/delete_object
  # calls `backend/app/storage_backends/s3.py` makes (no presigned URLs,
  # multipart, versioning, or MinIO Admin API in use anywhere in the app),
  # and it is configured with ONE S3 identity (STORAGE_ACCESS_KEY /
  # STORAGE_SECRET_KEY) that may act on the application bucket only, so the
  # backend's credential cannot reach any other bucket, list buckets, or
  # change storage configuration. Everything except the S3 gateway listens on
  # loopback, because SeaweedFS's filer and master APIs carry no
  # authentication. See docs/deployment.md, "Storage credential scope", for
  # how to harden further.
  storage:
    image: chrislusf/seaweedfs:3.97
    container_name: reqtrack-storage
    command: >-
      server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1
      -s3 -s3.port=9000 -s3.ip.bind=:: -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: storage_identity
        target: /etc/seaweedfs/s3.json
    volumes:
      - reqtrack_storage_data:/data
    # No host port published: only the backend talks to this over the
    # Compose network. There's no bundled admin console UI here (unlike
    # MinIO's old `:9001` console) — see docs/deployment.md's storage
    # backend section for how to inspect bucket contents without one.
    healthcheck:
      # The S3 API's own /healthz is broken in this image (returns 404 —
      # it's parsed as a bucket name; see seaweedfs#8243), so this checks
      # the master's cluster-status endpoint (loopback only) and that the S3
      # gateway answers (403 without credentials). wget, not curl — this
      # image has no curl binary.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status && wget -S -qO- http://127.0.0.1:9000/ 2>&1 | grep -q 'HTTP/1.1 403'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    # Deliberately single-process (no `--workers`/replica count here): login
    # verifies via bcrypt (cost factor 12, ~200ms of CPU-bound work per
    # call), which already parallelises across whatever cores this
    # container has (bcrypt's C extension releases the GIL) — so under a
    # login burst (e.g. many users at shift start), the safe lever is
    # allocating this container more CPU, not more worker processes.
    # Naively adding `--workers`/replicas would duplicate the in-process
    # scheduler (backend/app/services/scheduler.py — daily review-reminder
    # emails, stage auto-approval sweeps, module jobs), sending N-fold
    # duplicate emails, since that scheduler has no leader-election guard
    # yet. See docs/decisions.md, "bcrypt login cost under concurrent load".
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ballardr/reqtrackmanager}-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    environment:
      # Worker processes (CPU cores the API can use); see backend/docker-entrypoint.sh.
      BACKEND_WORKERS: ${BACKEND_WORKERS:-4}
      # Per-worker database pool: at most DB_POOL_SIZE + DB_MAX_OVERFLOW connections (plus two dedicated) each.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      # Requests a worker serves at once (0 = the pool's capacity) and how long an extra one waits before a 503.
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-0}
      REQUEST_QUEUE_TIMEOUT_SECONDS: ${REQUEST_QUEUE_TIMEOUT_SECONDS:-30}
      DATABASE_URL: postgresql://reqtrack:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in production}@db:5432/reqtrack
      # Refuse to start on a placeholder or short JWT secret, a placeholder encryption key or the bundled object
      # store's default key (config.py's weak_secret_problems). Set to false only for a throwaway stack.
      REQUIRE_STRONG_SECRETS: ${REQUIRE_STRONG_SECRETS:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in production}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:?Set APP_SECRET_ENCRYPTION_KEY in production}
      SERVER_ADMIN_ENABLED: "true"
      SERVER_ADMIN_EMAIL: ${SERVER_ADMIN_EMAIL:-admin@example.com}
      SERVER_ADMIN_PASSWORD: ${SERVER_ADMIN_PASSWORD:?Set SERVER_ADMIN_PASSWORD in production}
      SERVER_ADMIN_CREATE_ORG: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-reqtrackmanager}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-http://storage:9000}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-${STORAGE_ROOT_USER:-minioadmin}}
      STORAGE_S3_SECRET_KEY: ${STORAGE_SECRET_KEY:-${STORAGE_ROOT_PASSWORD:?Set STORAGE_SECRET_KEY in production}}
      # `disabled` sends no mail at all (every send fails before a connection is opened); the restore-test sets it
      # on its scratch copy so a restored database can never email real people.
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-smtp}
      # How long an emailed password-reset link works, in minutes (5 to 1440).
      CREDENTIAL_RESET_TOKEN_MINUTES: ${CREDENTIAL_RESET_TOKEN_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST to a real SMTP provider in production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@example.com}
      DEPLOYMENT_NOTIFICATION_EMAIL: ${DEPLOYMENT_NOTIFICATION_EMAIL:-}
      PUBLIC_BACKEND_URL: ${PUBLIC_API_BASE_URL-http://localhost:8000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      MCP_SERVER_PUBLIC_URL: ${MCP_SERVER_PUBLIC_URL:-http://localhost:8100}
      # Header Help link: the public docs site by default; set HELP_URL to an internally
      # hosted copy (the `docs` profile) or HELP_ENABLED=false to remove the link.
      HELP_ENABLED: ${HELP_ENABLED:-true}
      HELP_URL: ${HELP_URL:-https://ballardr.github.io/reqtrackmanager/}
    volumes:
      # Only used if STORAGE_BACKEND=local is set (default is s3/storage
      # above). Named so it survives container recreation and so
      # scripts/backup.sh (I-M-04) can archive it alongside the database.
      - reqtrack_local_files:/app/data/files
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      start_period: 120s
      timeout: 5s
      retries: 10

  # Disaster-recovery backup (docs/disaster-recovery.md). Not started with the stack: run it with the
  # `backup` profile, `scripts/dr-backup.sh` (or `docker compose --profile backup run --rm backup`). It has no
  # listener and no access to the Docker socket; it reads the database and the object store over the
  # Compose network with the application's own credentials (the bundled identity already holds Read and
  # List) and writes an encrypted restic repository. The repository volume is on THIS host, so a real
  # deployment also sets BACKUP_DESTINATIONS to a copy elsewhere. APP_SECRET_ENCRYPTION_KEY is only passed
  # so the dump's encrypted columns can be checked; set BACKUP_PROBE_ENCRYPTION_KEY= (empty) to keep the
  # key away from this container.
  backup:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ballardr/reqtrackmanager}-backup:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: backup
    profiles: ["backup"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql://reqtrack:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in production}@db:5432/reqtrack
      APP_SECRET_ENCRYPTION_KEY: ${BACKUP_PROBE_ENCRYPTION_KEY-${APP_SECRET_ENCRYPTION_KEY:-}}
      # Recorded in each set's manifest, so a restore can name the image the set was taken with.
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-reqtrackmanager}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-http://storage:9000}
      # The backup only lists and reads the store, so it may use a read-only identity: set
      # BACKUP_STORAGE_ACCESS_KEY / BACKUP_STORAGE_SECRET_KEY for an external S3 service (a read-only IAM user).
      # The bundled SeaweedFS 3.97 cannot express a read-only identity (see docs/disaster-recovery.md), so the
      # default is the application's pair there.
      STORAGE_S3_ACCESS_KEY: ${BACKUP_STORAGE_ACCESS_KEY:-${STORAGE_ACCESS_KEY:-${STORAGE_ROOT_USER:-minioadmin}}}
      STORAGE_S3_SECRET_KEY: ${BACKUP_STORAGE_SECRET_KEY:-${STORAGE_SECRET_KEY:-${STORAGE_ROOT_PASSWORD:?Set STORAGE_SECRET_KEY in production}}}
      BACKUP_PASSWORD_FILE: /run/secrets/backup_repo_password
      BACKUP_SECRETS_MODE: ${BACKUP_SECRETS_MODE:-config}
      BACKUP_CONFIG_AGE_RECIPIENT: ${BACKUP_CONFIG_AGE_RECIPIENT:-}
      BACKUP_BUNDLE_AGE_RECIPIENT: ${BACKUP_BUNDLE_AGE_RECIPIENT:-}
      BACKUP_DESTINATIONS: ${BACKUP_DESTINATIONS:-}
      BACKUP_KEEP_HOURLY: ${BACKUP_KEEP_HOURLY:-0}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_CHECK_SUBSET: ${BACKUP_CHECK_SUBSET-5%}
      # Schedule for the backup-scheduler service (HH:MM daily in the zone, or `every 6h`); unused by `run`.
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-}
      BACKUP_SCHEDULE_TIMEZONE: ${BACKUP_SCHEDULE_TIMEZONE:-UTC}
      BACKUP_SCHEDULE_RETRIES: ${BACKUP_SCHEDULE_RETRIES:-1}
      BACKUP_SCHEDULE_RETRY_MINUTES: ${BACKUP_SCHEDULE_RETRY_MINUTES:-30}
      # How often backups are meant to run, published for the staleness alert. Empty: 24 for `run` (set it when
      # cron runs more or less often), the schedule's own period for the scheduler.
      BACKUP_EXPECTED_INTERVAL_HOURS: ${BACKUP_EXPECTED_INTERVAL_HOURS:-}
      # Set by the restore-test, which mounts the repository read-only: read commands then take no lock.
      BACKUP_REPOSITORY_READ_ONLY: ${BACKUP_REPOSITORY_READ_ONLY:-false}
      # Credentials for the restic destinations (S3-compatible, Azure Blob); leave empty for others.
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_AWS_DEFAULT_REGION:-}
      AZURE_ACCOUNT_NAME: ${BACKUP_AZURE_ACCOUNT_NAME:-}
      AZURE_ACCOUNT_KEY: ${BACKUP_AZURE_ACCOUNT_KEY:-}
    volumes:
      # A named volume by default; BACKUP_REPO_VOLUME may be a host path (an NFS mount, a second disk).
      - ${BACKUP_REPO_VOLUME:-reqtrack_backup_repo}:/backup/repo
      # Holds the object mirror and, briefly, the unencrypted dump: Confidential, keep it on an encrypted disk.
      - reqtrack_backup_staging:/backup/staging
      # status.json and the Prometheus textfiles. BACKUP_STATUS_VOLUME may be a host path, so a host scheduler's
      # restore-test (--status-dir) writes beside them and Alloy reads one directory.
      - ${BACKUP_STATUS_VOLUME:-reqtrack_backup_status}:/backup/status
      # Read-only view of the local file store (only used when STORAGE_BACKEND=local).
      - reqtrack_local_files:/source/local_files:ro
      # The operator's .env, read only when BACKUP_SECRETS_MODE=config; set BACKUP_ENV_FILE=./.env.
      - ${BACKUP_ENV_FILE:-/dev/null}:/run/backup/env:ro
      # ssh keys and known_hosts for SFTP destinations; set BACKUP_SSH_DIR to a host directory to use them.
      - ${BACKUP_SSH_DIR:-reqtrack_backup_ssh}:/home/app/.ssh:ro
    secrets:
      - backup_repo_password
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  # Disaster-recovery restore (docs/disaster-recovery.md): the backup image running scripts/dr_restore.py, so
  # it shares the backup service's repository, staging, credentials and database/storage settings. Run it
  # through `scripts/restore.sh`, which stops the application first for an in-place restore. The only
  # difference from `backup` is write access to the local file store (STORAGE_BACKEND=local) so attachments
  # can be put back; it replaces the database by renaming a verified copy, never by writing into the live one.
  # (`extends` also carries the `backup` profile along, so `--profile backup` makes this service available too;
  # it only runs when named.)
  restore:
    extends:
      service: backup
    profiles: ["restore"]
    entrypoint: ["python", "scripts/dr_restore.py"]
    command: ["--help"]
    # A restore writes objects back, so it always uses the application's identity, never a read-only backup one.
    environment:
      STORAGE_S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-${STORAGE_ROOT_USER:-minioadmin}}
      STORAGE_S3_SECRET_KEY: ${STORAGE_SECRET_KEY:-${STORAGE_ROOT_PASSWORD:?Set STORAGE_SECRET_KEY in production}}
    volumes:
      - reqtrack_local_files:/source/local_files

  # In-container backup schedule (docs/disaster-recovery.md, "Scheduling and monitoring"): the backup image
  # running `dr_backup.py schedule`, so it takes a backup at each time in BACKUP_SCHEDULE with the same
  # settings, credentials and status files as a hand-run `backup`. Not started by default; use
  # `docker compose --profile backup-schedule up -d backup-scheduler`. Needs no Docker socket. A host with cron
  # or systemd can use those instead (scripts/schedule/); do not run both. The restore-test is scheduled from
  # the host only, because it drives Docker.
  backup-scheduler:
    extends:
      service: backup
    profiles: ["backup-schedule"]
    command: ["schedule"]
    restart: unless-stopped
    # A backup in progress is allowed to finish after SIGTERM; this is how long Compose waits before killing it.
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "scripts/dr_backup.py", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ballardr/reqtrackmanager}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    environment:
      # No colon in ${PUBLIC_API_BASE_URL-...} deliberately: with a colon,
      # an explicitly-empty PUBLIC_API_BASE_URL= (same-origin subpath
      # deployment — see docs/deployment.md) would be treated as unset and
      # silently overridden by the default. The no-colon form only falls
      # back when the variable is truly absent.
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    # Tier C ("federated" / Module Federation) frontend modules — module
    # system follow-up, 2026-09-07. Uncomment to serve a self-built
    # third-party module's remote bundle same-origin, at
    # /external-modules/<your-module>/remoteEntry.js — no frontend rebuild
    # required. Mirrors the backend's own equivalent EXTRA_MODULES_PATH
    # bind-mount pattern (`docs/deployment.md`'s "Adding an external module
    # by mounting a directory") applied to the frontend side; see that same
    # doc's "Adding a Tier C (federated) frontend module" section for the
    # full walkthrough, including the matching backend module.py your
    # module also needs (router-less, `frontend_manifest.tier="federated"`).
    # volumes:
    #   - ./external-modules:/usr/share/nginx/external-modules:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  # Read-only Model Context Protocol server exposing requirements to AI
  # assistants (Claude Code, VS Code Copilot Chat, Microsoft Copilot Studio,
  # etc.) via the same REST API everything else uses — see docs/mcp-server.md.
  # Every MCP tool call requires the caller's own ReqTrackManager access
  # token; this service holds no credentials of its own and does no
  # authorization itself, it only forwards the caller's token to `backend`.
  mcp-server:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ballardr/reqtrackmanager}-mcp-server:${IMAGE_TAG:-latest}
    build:
      context: ./mcp-server
    environment:
      REQTRACK_API_URL: http://backend:8000
      REQTRACK_PUBLIC_API_URL: ${PUBLIC_API_BASE_URL-http://localhost:8000}
      # On by default (docs/decisions.md's "AI approval via MCP" entry,
      # 2026-09): lets an AI assistant author/edit requirement content out
      # of the box. Set to "false" to opt this deployment back into
      # read-only-only. Note this is separate from, and does not by itself
      # enable, the further AI-approval capability (approve_requirement/
      # decide_change_request/complete_requirement) — that also needs an
      # org admin and a project manager to each explicitly enable it for
      # their own organisation/project. See docs/mcp-server.md's "Write
      # mode" section.
      MCP_WRITES_ENABLED: ${MCP_WRITES_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8100/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  # --- Documentation site (optional): docker compose --profile docs up ---
  # The docs hosted inside the deployment, for air-gapped installs or docs
  # that match the deployed version. Own host/port, so the site is at its
  # root; point the backend's HELP_URL at it (e.g. http://localhost:8200/).
  # See docs/deployment.md "Hosting the documentation internally".
  docs:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/ballardr/reqtrackmanager}-docs:${IMAGE_TAG:-latest}
    profiles: ["docs"]
    build:
      context: ./docs/website
      dockerfile: Dockerfile.prod
      args:
        DOCS_URL: ${DOCS_URL:-http://localhost:8200}
        # Baked into the site's asset URLs at build time (must start and end with `/`), so
        # changing it needs `docker compose --profile docs build docs`; a pulled image keeps
        # the `/` it was published with.
        DOCS_BASE_URL: ${DOCS_BASE_URL:-/}
    ports:
      - "8200:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  # --- Observability stack (optional): docker compose --profile observability up ---
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    # The remote-write receiver is how Alloy delivers the backup textfile metrics (observability/alloy.river).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:2.5.0
    profiles: ["observability"]
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4317:4317"

  alloy:
    image: grafana/alloy:v1.4.3
    profiles: ["observability"]
    volumes:
      - ./observability/alloy.river:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Backup and restore-test metric textfiles (read only).
      - ${BACKUP_STATUS_VOLUME:-reqtrack_backup_status}:/backup/status:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    depends_on:
      - loki
      - tempo
      - prometheus

  # Per-container CPU and memory for the "Resource usage" dashboard. It needs read access to the host's cgroups
  # and Docker's data directory, so it lives only in this profile, publishes no port (Prometheus reaches it on the
  # compose network) and mounts everything read-only. On Docker Desktop it reports the Linux VM's containers.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["observability"]
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # The kernel log is where OOM kills are reported (container_oom_events_total); reading it needs this one
    # capability, which is far narrower than `privileged`.
    devices:
      - /dev/kmsg:/dev/kmsg:r
    cap_add:
      - SYSLOG
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      start_period: 30s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3300:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  reqtrack_db_data:
  reqtrack_storage_data:
  reqtrack_local_files:
  reqtrack_backup_repo:
  reqtrack_backup_staging:
  reqtrack_backup_status:
  reqtrack_backup_ssh:

# The restic repository password for the `backup` profile: a file the operator keeps outside the repository
# and outside the data it protects (docs/disaster-recovery.md, "Key custody"). Only read when the backup
# service starts.
secrets:
  backup_repo_password:
    file: ${BACKUP_REPO_PASSWORD_FILE:-/dev/null}

# The one S3 identity the bundled storage accepts. It is restricted to the
# application bucket (Admin lets it create that bucket on first start, as the
# backend does; it cannot touch any other bucket). A value containing a quote or
# backslash makes this invalid JSON, which SeaweedFS rejects at startup.
configs:
  storage_identity:
    content: |
      {"identities":[{"name":"app",
        "credentials":[{"accessKey":"${STORAGE_ACCESS_KEY:-${STORAGE_ROOT_USER:-minioadmin}}","secretKey":"${STORAGE_SECRET_KEY:-${STORAGE_ROOT_PASSWORD:?Set STORAGE_SECRET_KEY in production}}"}],
        "actions":["Admin:${STORAGE_S3_BUCKET:-reqtrackmanager}","Read:${STORAGE_S3_BUCKET:-reqtrackmanager}","Write:${STORAGE_S3_BUCKET:-reqtrackmanager}","List:${STORAGE_S3_BUCKET:-reqtrackmanager}"]}]}
