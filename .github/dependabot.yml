# Dependency updates arrive as pull requests that the normal CI run (tests, dependency scan, image scan) must pass.
# GitHub Actions are pinned to a commit SHA (with the tag in a comment), so this is how a pinned action moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /mcp-server
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /tests/playwright
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /converter
    schedule: { interval: weekly }
