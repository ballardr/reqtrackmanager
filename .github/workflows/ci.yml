# GitHub Actions CI pipeline.
#
# Three jobs, run on every push to main, every pull request, and on demand:
#   1. frontend          - lint, type-check, and production build (fast, no Docker)
#   2. backend-and-e2e   - the same dev/test Docker Compose stack developers run
#                          locally (db, minio, mailhog, keycloak, backend,
#                          frontend, mcp-server); backend pytest with coverage
#                          + JUnit reporting, ruff lint, the mcp-server's own
#                          integration test suite, then the full Playwright
#                          E2E suite against the running containers
#   3. docker-build      - builds (but does NOT push) the production backend,
#                          frontend, and mcp-server images, gated on the two
#                          jobs above passing
#
# Test results are published as GitHub check annotations and as downloadable
# artifacts; a coverage summary is written to the job summary. This exists to
# close the primary gap flagged in docs/soc2/policies/change-management-and-
# secure-development-policy.md (SOC 2 CC4.1/CC8.1): tests existed and passed
# locally, but nothing enforced them automatically before this.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  backend-and-e2e:
    name: Backend tests, coverage & E2E
    runs-on: ubuntu-latest
    permissions:
      # write (not just read) is needed for the "Publish coverage/test
      # badges" step below, which pushes a small JSON file to the
      # `badges` branch using this job's own GITHUB_TOKEN — no external
      # badge service or extra secret, but a real, scoped-to-this-job
      # permission bump worth calling out explicitly.
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      # The dev/test stack (db, minio, mailhog, keycloak, backend, frontend)
      # is the same one developers run locally, and the only one the backend
      # test suite is allowed to run against — tests/conftest.py hard-fails
      # if DATABASE_URL doesn't resolve to a database whose name ends in
      # `_test` (see docs/decisions.md, "Database: the test suite was
      # wiping the live database"). Using the real compose file here, rather
      # than hand-rolled GitHub Actions `services:` blocks, keeps CI's
      # environment identical to what's documented and what a developer
      # actually runs — no second config to keep in sync.
      - name: Build and start the dev/test stack
        working-directory: tests/container
        run: docker compose up -d --build

      - name: Wait for backend to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: backend $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "backend never became healthy" >&2
          docker compose logs backend
          exit 1

      # Only needed for the Playwright SSO specs later in this job, but
      # waited on now so a slow Keycloak pull/boot doesn't surface as a
      # confusing failure partway through the E2E run instead of here.
      - name: Wait for Keycloak to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps keycloak --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: keycloak $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "keycloak never became healthy" >&2
          docker compose logs keycloak
          exit 1

      - name: Run backend tests with coverage
        working-directory: tests/container
        run: |
          docker compose exec -T backend python -m pytest \
            --cov=app --cov-report=xml --cov-report=term-missing --cov-report=html \
            --junitxml=pytest-report.xml -q
          docker compose cp backend:/app/coverage.xml ./coverage.xml
          docker compose cp backend:/app/pytest-report.xml ./pytest-report.xml
          docker compose cp backend:/app/htmlcov ./htmlcov

      - name: Lint backend (ruff)
        working-directory: tests/container
        run: docker compose exec -T backend ruff check .

      - name: Lint mcp-server (ruff)
        working-directory: tests/container
        run: docker compose exec -T mcp-server ruff check .

      - name: Backend coverage summary
        working-directory: tests/container
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.attrib["line-rate"]) * 100
          print("## Backend coverage")
          print()
          print(f"**{rate:.1f}%** line coverage ({root.attrib['lines-covered']}/{root.attrib['lines-valid']} lines).")
          print()
          print("Full HTML report attached as the `backend-coverage-html` artifact.")
          PY

      # Feeds the two shields.io "endpoint" badges at the top of README.md
      # (coverage %, pass/fail test count). No external badge service or
      # extra secret: this job's own GITHUB_TOKEN pushes a small JSON file
      # to a dedicated `badges` branch (a single, always-overwritten commit,
      # not a growing history), which shields.io's endpoint format reads
      # directly via a raw.githubusercontent.com URL. Best-effort — a
      # push failure here (e.g. a transient network error) must never fail
      # the actual CI signal, so this always runs and never fails the job.
      - name: Publish coverage/test badges
        if: always()
        continue-on-error: true
        working-directory: tests/container
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          try:
              coverage_pct = float(ET.parse("coverage.xml").getroot().attrib["line-rate"]) * 100
          except (FileNotFoundError, ET.ParseError, KeyError):
              raise SystemExit(0)  # nothing to report yet (e.g. pytest itself crashed) — skip quietly

          try:
              junit_root = ET.parse("pytest-report.xml").getroot()
          except (FileNotFoundError, ET.ParseError):
              raise SystemExit(0)
          suites = junit_root.findall(".//testsuite") if junit_root.tag == "testsuites" else [junit_root]
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          passed = total - failures - errors
          all_green = failures == 0 and errors == 0

          def coverage_color(pct: float) -> str:
              if pct >= 90:
                  return "brightgreen"
              if pct >= 75:
                  return "yellow"
              return "red"

          with open("coverage-badge.json", "w") as f:
              json.dump({
                  "schemaVersion": 1, "label": "backend coverage",
                  "message": f"{coverage_pct:.1f}%", "color": coverage_color(coverage_pct),
              }, f)
          with open("tests-badge.json", "w") as f:
              json.dump({
                  "schemaVersion": 1, "label": "backend tests",
                  "message": f"{passed} passed" if all_green else f"{passed}/{total} passed",
                  "color": "brightgreen" if all_green else "red",
              }, f)
          PY

          if [ ! -f coverage-badge.json ] || [ ! -f tests-badge.json ]; then
            echo "No coverage/test report to publish a badge from — skipping."
            exit 0
          fi

          rm -rf /tmp/badges-publish
          mkdir -p /tmp/badges-publish
          cp coverage-badge.json tests-badge.json /tmp/badges-publish/
          cd /tmp/badges-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges
          git add -A
          git commit -q -m "Update CI badges"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges:badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish backend test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Backend test results
          path: tests/container/pytest-report.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload backend coverage report (HTML)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-html
          path: tests/container/htmlcov
          retention-days: 14

      - name: Upload backend coverage/test reports (raw)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-reports
          path: |
            tests/container/coverage.xml
            tests/container/pytest-report.xml
          retention-days: 14

      # Backend pytest's schema fixture leaves the shared containers with a
      # migrated-but-empty database once the session ends (see conftest.py) —
      # restart to re-run bootstrap admin creation, then reseed the fixed
      # persona dataset the Playwright suite expects. Same sequence
      # documented for local development in docs/deployment.md's
      # troubleshooting section.
      - name: Restart backend and reseed E2E dataset
        working-directory: tests/container
        run: |
          docker compose restart backend
          for i in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker compose exec -T backend python scripts/seed_e2e_dataset.py

      # Runs after the E2E dataset is seeded so the full-chain test
      # (list_projects -> list_requirements -> get_requirement ->
      # get_requirement_history) has real data to exercise instead of
      # skipping — see mcp-server/tests/test_server.py.
      - name: Run MCP server tests
        working-directory: tests/container
        run: docker compose exec -T mcp-server python -m pytest -q

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: tests/playwright
        run: npx playwright test --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-report.xml

      - name: Publish E2E test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E (Playwright) test results
          path: tests/playwright/playwright-report.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright/playwright-report.xml
            tests/playwright/test-results
          retention-days: 14

      - name: Tear down the dev/test stack
        if: always()
        working-directory: tests/container
        run: docker compose down -v

  docker-build:
    name: Build production container images (not published)
    runs-on: ubuntu-latest
    needs: [frontend, backend-and-e2e]
    # Deliberately builds and tags but does not push, per explicit
    # instruction: the system hasn't been through enough real-world
    # (developer) usage yet to trust an automated publish. This job still
    # proves both production Dockerfiles build cleanly on every change.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # --- To actually publish once the system has been sufficiently
      # user-tested: uncomment this login step, and change `push: false` to
      # `push: true` on both build steps below. No extra secret is needed —
      # GITHUB_TOKEN already has `packages: write` (granted above) and is
      # accepted by ghcr.io directly.
      # - uses: docker/login-action@v4
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          # Provenance/SBOM attestations need an image reference to attach
          # to, which only exists once something is actually pushed —
          # disabled here since push is off; re-enable (or just drop these
          # two lines to accept the action's defaults) once push: true.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:latest

      - name: Build mcp-server image
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          push: false
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}-mcp-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}-mcp-server:latest
