# GitHub Actions CI pipeline.
#
# Seven jobs, run on every push to main, every pull request, and on demand:
#   1. frontend          - lint, type-check, production build, then the
#                          Storybook/Vitest suite (real Chromium) with
#                          coverage
#   2. backend-tests     - the same dev/test Docker Compose stack developers
#                          run locally, but only the services backend pytest
#                          actually needs (db, minio, mailhog, backend — not
#                          frontend/mcp-server/keycloak, which only
#                          e2e-tests below exercises); backend pytest with
#                          coverage + JUnit reporting, ruff lint.
#   3. e2e-tests         - the full dev/test stack (adds frontend, mcp-server,
#                          keycloak on top of backend-tests' subset), the
#                          mcp-server's own integration test suite, then the
#                          full Playwright E2E suite against the running
#                          containers. Split out from backend-tests (was one
#                          "backend-and-e2e" job) specifically so the two
#                          largest chunks of what used to be a single ~26min
#                          job — pytest at ~12min, Playwright at ~9min — run
#                          on two separate runners in parallel instead of
#                          back-to-back on one (Phase 1's CI-runtime-
#                          reduction pass only parallelised *within* the
#                          Playwright step and left this larger, sequential
#                          cost untouched; see docs/decisions.md). Each job
#                          independently builds the backend image it needs
#                          (both) via the same `cache-from/cache-to:
#                          type=gha` scope — a small amount of duplicated
#                          build time in exchange for not needing a third
#                          shared "build images" job plus artifact tar
#                          transfer just to avoid it.
#   4. publish-badges    - needs: [frontend, backend-tests]. Best-effort;
#                          turns both jobs' coverage/JUnit output into the
#                          four README badges and pushes them together to the
#                          `badges` branch. A dedicated job specifically to
#                          avoid frontend and backend-tests (which run in
#                          parallel) independently force-pushing their own
#                          badge files and racing each other — see that job's
#                          own comment. Doesn't need e2e-tests: nothing it
#                          reads comes from that job.
#   5. docker-build      - builds the production backend, frontend, and
#                          mcp-server images, gated on jobs 1-3 passing; tags
#                          each with GitVersion's computed SemVer plus the
#                          commit SHA and `latest`, and pushes all three to
#                          ghcr.io — except on pull_request runs, which still
#                          build (proving the Dockerfiles work) but never push
#   6. docs              - builds docs/website/ (Docusaurus) and fails on any
#                          broken internal link/anchor (onBrokenLinks/
#                          onBrokenAnchors: 'throw'), on every push and PR —
#                          independent of and parallel with every job above.
#   7. docs-deploy       - needs: [docs]. Push-only-on-main, same gating
#                          shape as docker-build; deploys docs/website/'s
#                          build to GitHub Pages via actions/deploy-pages.
#                          Requires GitHub Pages enabled in this repo's own
#                          Settings → Pages (source: "GitHub Actions") — a
#                          repo-admin action outside CI's own reach; fails
#                          with a clear error until that's done.
#
# Test results are published as GitHub check annotations and as downloadable
# artifacts; a coverage summary is written to the job summary. This exists to
# close the primary gap flagged in docs/soc2/policies/change-management-and-
# secure-development-policy.md (SOC 2 CC4.1/CC8.1): tests existed and passed
# locally, but nothing enforced them automatically before this.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, build & test
    runs-on: ubuntu-latest
    # 2026-08-19: running this job inside Playwright's own image instead of
    # bare `ubuntu-latest` + `playwright install --with-deps` (see the
    # deleted "Install Playwright browsers" step this replaced, and its
    # e2e-tests counterpart) — that install step ran `apt-get` on the
    # runner for Chromium's OS deps, which stalled inside `apt-get update`
    # against a flaky archive.ubuntu.com/security.ubuntu.com mirror twice in
    # one day (PR #9, then this same job again on PR #10; see
    # docs/decisions.md). This image ships Chromium and every OS dep
    # preinstalled, so there's no `apt-get` in the job at all — the stall
    # can't recur, not just fail faster.
    #
    # The tag's version MUST match frontend/package-lock.json's resolved
    # `playwright` version exactly (Playwright requires the npm package and
    # browser build to be the same release) — bump this tag in the same
    # change as any `playwright` version bump, the same way Node's version is
    # kept in lockstep across ci.yml/Dockerfile/.nvmrc (see CLAUDE.md).
    # Available tags: https://mcr.microsoft.com/en-us/artifact/mar/playwright
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # Normal runs finish in ~2 minutes; this is headroom, not an expected
    # ceiling — see backend-tests'/e2e-tests' timeout-minutes comments for
    # why every job/step here now has one.
    timeout-minutes: 15
    # checks: write is for the "Publish frontend test results" step below
    # (dorny/test-reporter creating a check run) — same reasoning as
    # backend-tests'/e2e-tests' identical permission.
    permissions:
      checks: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # actions/checkout sets `safe.directory` via a temporarily-overridden
      # HOME (see its own log output), which doesn't persist into this
      # job's real container HOME for later steps — dorny/test-reporter's
      # own `git ls-files` call below ("Publish frontend test results")
      # then hits "dubious ownership" and errors out (harmless:
      # continue-on-error: true means it doesn't fail the job, but it does
      # surface a red X annotation on every run). Only needed here, not in
      # backend-tests/e2e-tests: those jobs run directly on the bare
      # runner, not inside a `container:`, so checkout's own safe.directory
      # config already persists correctly for them.
      - name: Fix git safe.directory for containerized steps
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # test-storybook (vite.config.ts) runs every Storybook story as a real
      # Chromium test via Vitest's browser mode. No separate browser-install
      # step needed: the job container (see `container:` above) already has
      # a matching Chromium build baked in.
      #
      # `timeout` + the JUnit check below work around a real @vitest/browser
      # + Playwright-provider quirk (reproduced locally via `act`, not
      # specific to this container): the process can finish the actual run
      # — tests execute, the coverage report and vitest-report.xml are both
      # written correctly — and then simply never call process.exit(),
      # hanging indefinitely instead of returning. A bare `npm run` with no
      # timeout would hang this step (and the whole job) forever on a run
      # that already succeeded. 180s is generous headroom over the ~10s this
      # suite actually takes; a genuine hang before producing a report still
      # fails loudly (no vitest-report.xml to check, so the raw exit status
      # propagates), and a real per-test failure is caught explicitly by
      # parsing the JUnit output rather than assumed away.
      - name: Run frontend tests with coverage
        run: |
          set +e
          timeout 180 npm run test-storybook -- --coverage
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if [ ! -f vitest-report.xml ]; then
            echo "vitest failed before producing a report (exit $status)." >&2
            exit $status
          fi
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("vitest-report.xml").getroot()
          suites = root.findall(".//testsuite") if root.tag == "testsuites" else [root]
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          if failures or errors:
              print(f"{failures} failure(s), {errors} error(s) in vitest-report.xml.", file=sys.stderr)
              sys.exit(1)
          print("vitest didn't exit cleanly, but vitest-report.xml shows every test passed — treating as success.")
          PY

      - name: Frontend coverage summary
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("coverage/coverage-summary.json") as f:
              pct = json.load(f)["total"]["lines"]["pct"]
          print("## Frontend coverage")
          print()
          print(f"**{pct:.2f}%** line coverage.")
          print()
          print("Full HTML report attached as the `frontend-coverage-html` artifact.")
          print()
          print(
              "Low by design today: only Storybook stories under `test-storybook` "
              "count towards this number, and most page-level logic is instead "
              "covered by the Playwright E2E suite (see the `e2e-tests` job), "
              "which this badge doesn't measure."
          )
          PY

      # Same continue-on-error reasoning as backend-tests'/e2e-tests'
      # equivalent steps: "Run frontend tests with coverage" above (no
      # if: always()) is the real pass/fail gate via its own exit code;
      # these three are reporting/artifact-attachment conveniences layered
      # on top.
      - name: Publish frontend test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Frontend test results
          path: frontend/vitest-report.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload frontend coverage report (HTML)
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: frontend-coverage-html
          path: frontend/coverage
          retention-days: 14

      - name: Upload frontend coverage/test reports (raw)
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: frontend-test-reports
          path: |
            frontend/coverage/coverage-summary.json
            frontend/vitest-report.xml
          retention-days: 14

  backend-tests:
    name: Backend tests & coverage
    runs-on: ubuntu-latest
    # Normal runs finish in ~13-15 minutes (docker build + pytest + ruff).
    # Without a ceiling here a stalled step just sits until someone notices
    # and cancels it manually, instead of failing the run automatically —
    # see e2e-tests' identical timeout-minutes comment for the real incident
    # (an 18-minute apt-get mirror hang) this pattern exists to catch.
    timeout-minutes: 20
    permissions:
      # checks: write is for the "Publish backend test results" step below
      # (dorny/test-reporter creating a check run). Badge publishing (which
      # used to run here, needing contents: write) now happens in the
      # dedicated publish-badges job instead — see that job's own comment
      # for why.
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pre-build via buildx directly (rather than letting `docker compose
      # up --build` build it) so it can use its own GitHub Actions cache
      # scope for BuildKit layers (`cache-from`/`cache-to: type=gha`) —
      # layers for an unchanged requirements.txt then survive between CI
      # runs instead of every run reinstalling every dependency from
      # scratch. `load: true` puts the built image into the runner's local
      # Docker daemon under the exact `<compose-project>-backend` name
      # Compose would otherwise build itself (the project name defaults to
      # this directory's basename, "container" — see docker-compose.yml's
      # own top comment), so the `docker compose up -d` step below finds a
      # matching image already present and skips building it again. This
      # same image is also built independently by e2e-tests (below) — see
      # this file's own top comment for why that small duplication is
      # preferable to a third, shared "build images" job.
      - name: Build backend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          tags: container-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # The dev/test stack (tests/container/docker-compose.yml) is the same
      # one developers run locally, and the only one the backend test suite
      # is allowed to run against — tests/conftest.py hard-fails if
      # DATABASE_URL doesn't resolve to a database whose name ends in
      # `_test` (see docs/decisions.md, "Database: the test suite was
      # wiping the live database"). Only the services backend pytest
      # actually needs come up here — db and minio are backend's own
      # declared `depends_on`, so `docker compose up -d backend` would
      # start them regardless, but mailhog isn't (backend just points
      # SMTP_HOST at it with no formal dependency) and several backend
      # tests do send real mail through it (test_notifications.py,
      # test_digest.py, etc.), so it's listed explicitly. frontend/
      # mcp-server/keycloak are left down entirely — only e2e-tests (below)
      # needs them. No `--build`: the step above already built (and
      # cached) the backend image; passing `--build` here would rebuild it
      # a second time with none of buildx's GHA cache wired in.
      - name: Start the dev/test stack (backend + its dependencies)
        working-directory: tests/container
        run: docker compose up -d db minio mailhog backend

      - name: Wait for backend to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: backend $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "backend never became healthy" >&2
          docker compose logs backend
          exit 1

      # `-n 4`, not `-n 2`: the GitHub-hosted `ubuntu-latest` runner has 4
      # vCPUs (confirmed via buildx's own "CPUs: 4" setup log on this exact
      # job), and this step is the single largest chunk of CI time (~12 of
      # the old combined job's ~26 minutes) — `-n 2` was only using half
      # the runner's cores on it. `_pytest_database.py`'s per-worker
      # database isolation is already generic on `PYTEST_XDIST_WORKER`
      # (`_gw0`, `_gw1`, ...), not hardcoded to any worker count, so this is
      # a mechanical bump, not a design change.
      - name: Run backend tests with coverage
        working-directory: tests/container
        run: |
          docker compose exec -T backend python -m pytest -n 4 \
            --cov=app --cov-report=xml --cov-report=term-missing --cov-report=html \
            --junitxml=pytest-report.xml -q
          docker compose cp backend:/app/coverage.xml ./coverage.xml
          docker compose cp backend:/app/pytest-report.xml ./pytest-report.xml
          docker compose cp backend:/app/htmlcov ./htmlcov

      - name: Lint backend (ruff)
        working-directory: tests/container
        run: docker compose exec -T backend ruff check .

      - name: Backend coverage summary
        working-directory: tests/container
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.attrib["line-rate"]) * 100
          print("## Backend coverage")
          print()
          print(f"**{rate:.1f}%** line coverage ({root.attrib['lines-covered']}/{root.attrib['lines-valid']} lines).")
          print()
          print("Full HTML report attached as the `backend-coverage-html` artifact.")
          PY

      # continue-on-error on this and the two upload-artifact steps below:
      # the real pass/fail signal for the backend suite is already pytest's
      # own exit code, on the "Run backend tests with coverage" step above
      # (which has no if: always() and correctly fails the job on a real
      # test failure) — these three are reporting/artifact-attachment
      # conveniences layered on top, not the gate itself. Without
      # continue-on-error, an unrelated hiccup in any one of them (a
      # GitHub API blip creating the check run, an artifact-service issue)
      # would fail the job for a reason that has nothing to do with whether
      # the tests actually passed. Found via local `act` runs where these
      # steps fail for a different reason (`act` has no real
      # ACTIONS_RUNTIME_TOKEN), which surfaced the same underlying gap:
      # this job's step graph, not just this local limitation.
      - name: Publish backend test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Backend test results
          path: tests/container/pytest-report.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload backend coverage report (HTML)
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage-html
          path: tests/container/htmlcov
          retention-days: 14

      - name: Upload backend coverage/test reports (raw)
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: backend-test-reports
          path: |
            tests/container/coverage.xml
            tests/container/pytest-report.xml
          retention-days: 14

      - name: Tear down the dev/test stack
        if: always()
        working-directory: tests/container
        run: docker compose down -v

  e2e-tests:
    name: E2E (Playwright) suite
    runs-on: ubuntu-latest
    # Normal runs finish in ~12-15 minutes (docker build x3 + stack startup +
    # seeding + mcp-server tests + full Playwright suite). Without a ceiling
    # here a stalled step (see docs/decisions.md for a real instance of
    # this: an 18-minute apt-get mirror hang with no output, in what was
    # then this job's "Install Playwright browsers" step before it moved
    # into a Docker image — see "Run Playwright E2E suite" below) just sits
    # until someone notices and cancels it manually, instead of failing the
    # run automatically.
    timeout-minutes: 30
    permissions:
      # checks: write is for the "Publish E2E test results" step below
      # (dorny/test-reporter creating a check run).
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - uses: docker/setup-buildx-action@v4

      # Pre-build each of tests/container/docker-compose.yml's three
      # buildable images via buildx directly (rather than letting `docker
      # compose up --build` build them) so each can use its own GitHub
      # Actions cache scope for BuildKit layers (`cache-from`/`cache-to:
      # type=gha`) — layers for unchanged dependency files (requirements.txt,
      # package-lock.json) then survive between CI runs instead of every run
      # reinstalling every dependency from scratch. `load: true` puts each
      # built image into the runner's local Docker daemon under the exact
      # `<compose-project>-<service>` name Compose would otherwise build
      # itself (the project name defaults to this directory's basename,
      # "container" — see docker-compose.yml's own top comment), so the
      # `docker compose up -d` step below finds a matching image already
      # present and skips building it again. The backend image here is
      # also built independently by backend-tests (above) — see this
      # file's own top comment for why that small duplication is
      # preferable to a third, shared "build images" job.
      - name: Build backend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          tags: container-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          tags: container-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build mcp-server image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          tags: container-mcp-server:latest
          load: true
          cache-from: type=gha,scope=mcp-server
          cache-to: type=gha,mode=max,scope=mcp-server

      # The dev/test stack (db, minio, mailhog, keycloak, backend, frontend,
      # mcp-server) is the same one developers run locally. Using the real
      # compose file here, rather than hand-rolled GitHub Actions
      # `services:` blocks, keeps CI's environment identical to what's
      # documented and what a developer actually runs — no second config to
      # keep in sync. No `--build`: the three steps above already built
      # (and cached) backend/frontend/mcp-server; passing `--build` here
      # would rebuild them a second time with none of buildx's GHA cache
      # wired in.
      - name: Start the dev/test stack
        working-directory: tests/container
        run: docker compose up -d

      - name: Wait for backend to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: backend $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "backend never became healthy" >&2
          docker compose logs backend
          exit 1

      # Needed for the Playwright SSO specs later in this job, but waited on
      # now so a slow Keycloak pull/boot doesn't surface as a confusing
      # failure partway through the E2E run instead of here.
      - name: Wait for Keycloak to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps keycloak --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: keycloak $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "keycloak never became healthy" >&2
          docker compose logs keycloak
          exit 1

      # `docker compose restart backend` right before seeding is a cheap,
      # deterministic way to guarantee a clean bootstrap-admin state rather
      # than depending on whatever `reqtrack_test` happened to look like
      # after container startup — unrelated to backend-tests (a separate
      # job/runner entirely now, so there's no shared state to recover
      # from). The two seed scripts are what this step actually exists
      # for: reseeding both fixed datasets the Playwright suite expects —
      # the E2E persona/org/project set most specs are written against, and
      # the demo dataset (demo.admin@example.com etc.) badge-filters.spec.ts
      # specifically needs — since nothing earlier in this job has
      # populated `reqtrack_test` with either one yet. Same sequence
      # documented for local development in docs/deployment.md's
      # troubleshooting section.
      - name: Restart backend and reseed test datasets
        working-directory: tests/container
        run: |
          docker compose restart backend
          for i in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker compose exec -T backend python scripts/seed_demo_data.py
          docker compose exec -T backend python scripts/seed_e2e_dataset.py

      # Runs after the E2E dataset is seeded so the full-chain test
      # (list_projects -> list_requirements -> get_requirement ->
      # get_requirement_history) has real data to exercise instead of
      # skipping — see mcp-server/tests/test_server.py.
      - name: Run MCP server tests
        working-directory: tests/container
        run: docker compose exec -T mcp-server python -m pytest -q

      - name: Lint mcp-server (ruff)
        working-directory: tests/container
        run: docker compose exec -T mcp-server ruff check .

      - name: Install npm dependencies
        working-directory: tests/playwright
        run: npm ci

      # This job can't switch to running entirely inside Playwright's Docker
      # image the way the frontend job does (see that job's `container:`
      # comment for the full reasoning) — it already spends most of its time
      # driving `docker compose`/`docker compose exec` directly against the
      # runner's own Docker daemon to run the dev/test stack above, and
      # nesting that inside a job container would mean Docker-in-Docker, not
      # a one-line change. Instead, only the test run itself moves into a
      # throwaway container of that same image, via a plain `docker run`
      # against the same host daemon the compose stack is already using.
      # `--network host` lets it reach the stack's services on `localhost`
      # exactly like a native `npx playwright test` would (see
      # playwright.config.ts's baseURL and every service's host port mapping
      # in tests/container/docker-compose.yml); mounting the working
      # directory (already `npm ci`'d above — @playwright/test has no native
      # deps, so a host-installed node_modules is safe to mount into another
      # Linux/glibc container) means this runs the exact same test files and
      # config as a native process would, just without an `apt-get`-based
      # browser install in the path — which removes the flaky-mirror stall
      # that hit this exact step (see docs/decisions.md and the frontend
      # job's identical fix) instead of merely timing it out faster.
      #
      # `-e CI=true`: playwright.config.ts's `retries: process.env.CI ? 2 :
      # 0` is meant to retry a test on the transient client-side connection
      # stall Phase 1 documented (docs/decisions.md) — but `docker run`
      # starts a fresh container with its own empty environment, so without
      # this flag `process.env.CI` was always undefined *inside* the
      # container regardless of the real CI run's own environment, silently
      # disabling that retry on every CI run since Phase 1 added it (found
      # investigating PR #20's failures: none of the 5 failing tests showed
      # a retry attempt in the log). `true` matches the truthy-string value
      # GitHub Actions itself sets on the runner.
      #
      # The image tag's version MUST match tests/playwright/package-lock.json's
      # resolved `@playwright/test` version exactly — see the frontend job's
      # `container:` comment for why, and bump both together.
      - name: Run Playwright E2E suite
        working-directory: tests/playwright
        run: |
          docker run --rm --network host \
            -e CI=true \
            -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=playwright-report.xml \
            -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            npx playwright test --reporter=list,junit

      # Same continue-on-error reasoning as backend-tests' Publish/Upload
      # steps: "Run Playwright E2E suite" (no if: always()) is the real
      # pass/fail gate via its own exit code; these two are reporting
      # conveniences that must not be able to mask whether it actually ran.
      - name: Publish E2E test results
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: E2E (Playwright) test results
          path: tests/playwright/playwright-report.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            tests/playwright/playwright-report.xml
            tests/playwright/test-results
          retention-days: 14

      - name: Tear down the dev/test stack
        if: always()
        working-directory: tests/container
        run: docker compose down -v

  publish-badges:
    name: Publish coverage/test badges
    runs-on: ubuntu-latest
    needs: [frontend, backend-tests]
    # Normal runs finish in ~10 seconds; see backend-tests'
    # timeout-minutes comment for why every job here now has a ceiling.
    timeout-minutes: 10
    # Feeds the four shields.io "endpoint" badges at the top of README.md
    # (backend/frontend × coverage %/pass-fail count). No external badge
    # service or extra secret: this job's own GITHUB_TOKEN pushes small JSON
    # files to a dedicated `badges` branch, which shields.io's endpoint
    # format reads directly via a raw.githubusercontent.com URL.
    #
    # A dedicated job, not a step inside frontend/backend-tests (where the
    # backend half used to live): those two jobs run in parallel, and each
    # independently force-pushing its own badge files straight to `badges`
    # is a real race — whichever push lands second would wipe out the
    # other's files, since each started from a bare, freshly-initialised
    # git history with no knowledge of the other job's commit. Waiting for
    # both jobs via `needs:` and publishing once, from one job, removes the
    # race entirely.
    #
    # `if: always()`, and every step below is best-effort: a coverage/badge
    # hiccup must never fail the actual CI signal (already reported via each
    # job's own pass/fail and the dorny/test-reporter check runs), and one
    # side being unavailable (e.g. the frontend job failed before producing
    # a report) shouldn't block publishing the other side's badges.
    if: always()
    permissions:
      contents: write
    steps:
      # upload-artifact preserves each artifact's paths relative to the
      # *common ancestor* of the paths it was given, not the workspace root
      # — backend-tests uploaded `tests/container/{coverage.xml,pytest-
      # report.xml}` (ancestor `tests/container/`) and frontend uploaded
      # `frontend/{coverage/coverage-summary.json,vitest-report.xml}`
      # (ancestor `frontend/`), so each artifact's own root already is that
      # directory's contents — no `tests/container/`/`frontend/` prefix to
      # account for below.
      - name: Download backend test reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: backend-test-reports
          path: backend-reports

      - name: Download frontend test reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: frontend-test-reports
          path: frontend-reports

      - name: Generate badge JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def coverage_color(pct: float) -> str:
              if pct >= 90:
                  return "brightgreen"
              if pct >= 75:
                  return "yellow"
              return "red"

          def junit_counts(path: str) -> tuple[int, int] | None:
              try:
                  root = ET.parse(path).getroot()
              except (FileNotFoundError, ET.ParseError):
                  return None
              suites = root.findall(".//testsuite") if root.tag == "testsuites" else [root]
              total = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              return total, total - failures - errors

          def write_badges(prefix: str, label: str, coverage_pct: float | None, counts: tuple[int, int] | None) -> None:
              if coverage_pct is not None:
                  Path(f"{prefix}-coverage-badge.json").write_text(json.dumps({
                      "schemaVersion": 1, "label": f"{label} coverage",
                      "message": f"{coverage_pct:.1f}%", "color": coverage_color(coverage_pct),
                  }))
              if counts is not None:
                  total, passed = counts
                  all_green = passed == total
                  Path(f"{prefix}-tests-badge.json").write_text(json.dumps({
                      "schemaVersion": 1, "label": f"{label} tests",
                      "message": f"{passed} passed" if all_green else f"{passed}/{total} passed",
                      "color": "brightgreen" if all_green else "red",
                  }))

          backend_coverage = None
          try:
              backend_coverage = float(ET.parse("backend-reports/coverage.xml").getroot().attrib["line-rate"]) * 100
          except (FileNotFoundError, ET.ParseError, KeyError):
              pass
          write_badges("backend", "backend", backend_coverage, junit_counts("backend-reports/pytest-report.xml"))

          frontend_coverage = None
          try:
              frontend_coverage = json.loads(Path("frontend-reports/coverage/coverage-summary.json").read_text())["total"]["lines"]["pct"]
          except (FileNotFoundError, KeyError):
              pass
          write_badges("frontend", "frontend", frontend_coverage, junit_counts("frontend-reports/vitest-report.xml"))
          PY

      - name: Push badges
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          badge_files=(*-badge.json)
          if [ ${#badge_files[@]} -eq 0 ]; then
            echo "No coverage/test reports available to publish badges from — skipping."
            exit 0
          fi

          workdir="$PWD"
          rm -rf /tmp/badges-publish
          mkdir -p /tmp/badges-publish
          cd /tmp/badges-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Start from whatever's already published, if anything, so a
          # partial run (e.g. only one side's tests produced a report this
          # time) updates just those files rather than wiping out the other
          # side's most recently published badges.
          if git fetch -q origin badges:refs/remotes/origin/badges 2>/dev/null && \
             git rev-parse -q --verify refs/remotes/origin/badges >/dev/null; then
            git checkout -q -B badges refs/remotes/origin/badges
          else
            git checkout -q --orphan badges
          fi
          cp "$workdir"/*-badge.json .
          git add -A
          git commit -q -m "Update CI badges" --allow-empty
          git push -q -f origin badges:badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  docker-build:
    name: Build, version, and push production container images
    runs-on: ubuntu-latest
    needs: [frontend, backend-tests, e2e-tests]
    # Normal runs finish in ~2-3 minutes; see backend-tests'
    # timeout-minutes comment for why every job here now has a ceiling.
    timeout-minutes: 20
    # Builds and tags on every run (proving all three production Dockerfiles
    # still build cleanly), but only pushes to ghcr.io when this isn't a
    # pull_request run — a same-repo PR's GITHUB_TOKEN could technically
    # push, but a feature branch has no business publishing `:latest` (or
    # any tag) to the registry a real deployment pulls from. No extra secret
    # is needed to push: GITHUB_TOKEN already has `packages: write` (granted
    # below) and ghcr.io accepts it directly.
    permissions:
      contents: read
      packages: write
    steps:
      # fetch-depth: 0 (full history, including tags) is required for
      # GitVersion below to compute a version from the repo's actual commit
      # graph rather than the single shallow commit Actions checks out by
      # default.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      # GitVersion.yml (repo root) sets `mode: ContinuousDeployment` — every
      # commit on main is treated as a release, so the version bumps
      # automatically with each merge instead of requiring a manually pushed
      # git tag. No tags exist yet, so this starts at 0.1.0 (`next-version`)
      # and increments from there.
      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      # Feeds both images' APP_VERSION/GIT_SHA/BUILD_DATE build args below —
      # otherwise GitVersion's SemVer only ever lived in the image *tag*,
      # with no way for a running instance to report its own build identity
      # (GET /api/v1/system/version, the nav rail's version footer).
      - name: Determine build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.gitversion.outputs.semVer }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ steps.gitversion.outputs.semVer }}
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.gitversion.outputs.semVer }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ steps.gitversion.outputs.semVer }}
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:latest

      - name: Build and push mcp-server image
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}-mcp-server:${{ steps.gitversion.outputs.semVer }}
            ghcr.io/${{ github.repository }}-mcp-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}-mcp-server:latest

  docs:
    name: Build documentation website
    runs-on: ubuntu-latest
    # Independent of and parallel with every job above — shares no state
    # with them, so no `needs:`. Runs on every push and PR (unlike
    # docs-deploy below): `npm run build` is what actually exercises
    # onBrokenLinks/onBrokenAnchors: 'throw' (docusaurus.config.ts), so a PR
    # that breaks a doc link or leaves a page unreachable fails here before
    # merge, not silently after deploy.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docs-deploy:
    name: Deploy documentation website to GitHub Pages
    runs-on: ubuntu-latest
    needs: [docs]
    # Only push a new deployment from main, never from a PR — mirrors
    # docker-build's push-vs-PR gating above. GitHub Pages must be enabled
    # in this repo's own Settings → Pages (source: "GitHub Actions") before
    # this job can succeed — a repo-admin action outside git/CI that CI
    # itself cannot perform; until it's enabled, this job fails with a
    # clear "Pages not enabled" error, which is expected, not a bug here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      # A separate job has a separate runner/workspace, so `docs` above
      # can't hand this job its already-built output directly — rebuilding
      # here (~1min) is simpler than a third shared job plus
      # upload-artifact/download-artifact just to avoid it, the same
      # trade-off docker-build's own comment makes for its image builds.
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/website/build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
