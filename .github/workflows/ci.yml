# GitHub Actions CI pipeline, run on every push to main, every pull request and on demand.
#
# Jobs:
#   1. frontend         - lint, type-check, production build, then the Storybook/Vitest suite
#                         (real Chromium) with coverage, run as three `frontend-shard` jobs whose
#                         blob reports `frontend` merges (it keeps the required check name).
#   2. backend-tests    - the dev/test Docker Compose services backend pytest needs (db, storage,
#                         mailhog, backend); pytest with coverage and JUnit reporting, ruff, mypy.
#   3. e2e-tests        - three shards on the full dev/test stack (adds frontend, mcp-server,
#                         keycloak): the mcp-server integration suite (shard 1) and each shard's
#                         share of Playwright; `e2e-suite` reports the combined result under the
#                         required check name. Separate from backend-tests so pytest and
#                         Playwright run on parallel runners; each job builds its own backend image
#                         through the shared `type=gha` cache scope rather than a shared build job.
#   4. publish-badges   - needs frontend and backend-tests; best-effort. Turns their coverage and
#                         JUnit output into the README badges and pushes them together to the
#                         `badges` branch (one job, so parallel jobs never race on the push).
#   5. dependency-scan  - pip-audit (backend, mcp-server) and npm audit (frontend, Playwright; the
#                         docs site is reported only) against the pinned dependency files.
#   5a. licences        - scripts/check_licences.py --live: every shipped dependency, operating-system
#                         package and base image is judged against scripts/licence_policy.json and
#                         the committed third-party inventory must match the lockfiles.
#   5a2. cla            - pull requests only: every commit author is a maintainer, an automation
#                         account or a signatory of the current CLA.md (scripts/check_cla.py).
#   5b. image-scan      - builds the production images (amd64) and scans each with Trivy.
#   5c. restore-test    - disaster-recovery backup/restore self-check on throwaway stacks.
#   5d. version         - GitVersion SemVer and build date, computed once for every image leg.
#   6. docker-build     - one leg per production image (backend, backup, frontend, mcp-server, docs)
#                         and architecture (amd64, arm64), each on a native runner. Gated on jobs
#                         1-3, dependency-scan, licences, image-scan and version. The arm64 legs
#                         also smoke test (scripts/smoke_test_image.sh) and Trivy scan the image;
#                         only a passing leg pushes its digest, never on pull_request runs.
#   6b. docker-publish  - main only, after every docker-build leg: assembles each image's digests
#                         into a multi-arch manifest tagged with the SemVer, commit SHA and
#                         `latest` on ghcr.io, and verifies both platforms.
#   6c. images-gate     - reports the ruleset's required check "Build, version, and push production
#                         container images"; passes only if version, every docker-build leg and (on
#                         main) docker-publish passed.
#   7. docs             - builds docs/website/ (Docusaurus); fails on a broken internal link or
#                         anchor (onBrokenLinks/onBrokenAnchors: 'throw').
#   8. docs-deploy      - main only, needs docs; deploys the build to GitHub Pages through
#                         actions/deploy-pages (requires Pages enabled with source "GitHub Actions").
#
# Test results are published as check annotations and downloadable artifacts, with a coverage
# summary in the job summary. Automatic test enforcement addresses the gap named in
# docs/soc2/policies/change-management-and-secure-development-policy.md (SOC 2 CC4.1/CC8.1).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned once; used by image-scan (amd64 images) and docker-build's arm64 legs so both apply the same scanner.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0

jobs:
  # Security-specific scans (docs/development.md, "Security scanning"). Each fails the run on a high finding, and a
  # clean first run was reached by fixing the code, not by a baseline or a suppression; an unavoidable false
  # positive carries its reason beside it (`# nosemgrep`, `.gitleaks.toml`).
  static-analysis:
    name: Static analysis (Python and front end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # High severity only; the pinned version keeps a new rule from failing an unrelated change.
      - name: Bandit (Python, high severity)
        run: |
          python3 -m pip install --quiet bandit==1.8.6
          python3 -m bandit -r backend/app mcp-server/server.py converter/converter.py converter/diagram_worker.py scripts \
            --severity-level high -x '*/tests/*' -q

      - name: Semgrep (Python, TypeScript and React, error severity)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.108.0 semgrep scan \
            --config p/python --config p/flask --config p/jwt --config p/javascript --config p/typescript --config p/react \
            --severity ERROR --error --metrics=off \
            --exclude tests --exclude node_modules --exclude storybook-static --exclude dist --exclude coverage \
            /src/backend/app /src/mcp-server /src/converter /src/scripts /src/frontend/src /src/frontend/docker

  secret-scan:
    name: Secret scan (history and working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks over the whole history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

      - name: Gitleaks over the working tree
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 dir /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  # The Storybook suite (616 files, ~5k tests, each a real Chromium test) is split over three jobs; each writes a
  # blob report and the `frontend` job below merges them into the one coverage report and JUnit file the badges and
  # the check read. Shard 1 also runs the lint, the type-check and build and the lazy-loading check (about two
  # minutes), so they run beside the other shards and not after them.
  frontend-shard:
    name: Storybook shard ${{ matrix.shard }} of 3
    runs-on: ubuntu-latest
    # Runs inside Playwright's own image rather than bare `ubuntu-latest` plus `playwright install
    # --with-deps`: that install ran `apt-get` on the runner, which stalled against a flaky Ubuntu mirror
    # (docs/decisions.md). The image ships Chromium and every OS dependency, so no `apt-get` runs in the job.
    #
    # The tag's version MUST match frontend/package-lock.json's resolved `playwright` version (the npm
    # package and the browser build must be the same release); the e2e-tests job's `docker run` image
    # tracks tests/playwright/package-lock.json, a separate lockfile that can sit on a different release.
    # Bump the tag with any `playwright` bump, as Node's version is kept in lockstep across
    # ci.yml/Dockerfile/.nvmrc (see CLAUDE.md).
    # Available tags: https://mcr.microsoft.com/en-us/artifact/mar/playwright
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    # A shard is ~2 minutes of set-up and ~5 of tests on a 4-vCPU runner. If one is outgrown, raise the
    # shard count here and in `--shard`, never the ceiling.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fails fast, with an actionable message, if this job's Playwright image
      # tag has drifted from its lockfile — otherwise the browser can't launch
      # and the run silently executes zero tests. See the script's docstring.
      - name: Check Playwright image matches lockfile
        run: python3 "$GITHUB_WORKSPACE/scripts/check-playwright-image-sync.py"

      # actions/checkout sets `safe.directory` via a temporarily-overridden HOME, which doesn't persist into this job's
      # container HOME for later steps (see git's "dubious ownership" error).
      - name: Fix git safe.directory for containerized steps
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

      - name: Type-check and build
        if: matrix.shard == 1
        run: npm run build

      # The diagram library (Mermaid) must stay a lazily loaded chunk, never part of the files every page loads.
      - name: Mermaid is lazy-loaded
        if: matrix.shard == 1
        run: python3 ../scripts/check_mermaid_lazy.py

      # Runs this shard's share of the stories as real Chromium tests (vite.config.ts) and writes a blob report.
      # `timeout` works around a real @vitest/browser + Playwright-provider quirk: the process can finish the run and
      # write its report and then never call process.exit(), hanging for ever. The blob's presence shows the run
      # finished; whether every test passed is judged on the merged JUnit report by the `frontend` job, so a failing
      # story does not stop the other shards' reports from being merged.
      - name: Run this shard's stories with coverage
        run: |
          set +e
          timeout 1200 npx vitest run --project=storybook --coverage --shard=${{ matrix.shard }}/3 --reporter=blob
          status=$?
          set -e
          if [ ! -f ".vitest/blob/blob-${{ matrix.shard }}-3.json" ]; then
            echo "vitest failed before producing a report (exit $status)." >&2
            exit 1
          fi

      # `.vitest` is a hidden directory, which upload-artifact leaves out unless told otherwise.
      - name: Upload the blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-blob-${{ matrix.shard }}
          path: frontend/.vitest/blob
          include-hidden-files: true
          retention-days: 2

  # The one check the repository requires for the front end: it passes only when every shard ran and the merged report
  # shows every story passing. It keeps the name a ruleset already lists, so splitting the suite changes no rule.
  frontend:
    name: Frontend lint, build & test
    runs-on: ubuntu-latest
    needs: [frontend-shard]
    if: always()
    # Runs inside Playwright's own image rather than bare `ubuntu-latest` plus `playwright install
    # --with-deps`: that install ran `apt-get` on the runner, which stalled against a flaky Ubuntu mirror
    # (docs/decisions.md). The image ships Chromium and every OS dependency, so no `apt-get` runs in the job.
    #
    # The tag's version MUST match frontend/package-lock.json's resolved `playwright` version (the npm
    # package and the browser build must be the same release); the e2e-tests job's `docker run` image
    # tracks tests/playwright/package-lock.json, a separate lockfile that can sit on a different release.
    # Bump the tag with any `playwright` bump, as Node's version is kept in lockstep across
    # ci.yml/Dockerfile/.nvmrc (see CLAUDE.md).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 20
    # checks: write is for the "Publish frontend test results" step (dorny/test-reporter creating a check run).
    permissions:
      checks: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Every shard produced a report
        working-directory: .
        env:
          SHARDS: ${{ needs.frontend-shard.result }}
        run: |
          echo "Storybook shards: $SHARDS"
          [ "$SHARDS" = "success" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fix git safe.directory for containerized steps
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the shards' blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: storybook-blob-*
          merge-multiple: true
          path: frontend/.vitest/blob

      # Merges the shards' blob reports into one run: the combined coverage report (coverage/) and the JUnit file
      # (vitest-report.xml), exactly what a single run wrote before. No story runs here.
      - name: Merge the shards' reports
        run: |
          set +e
          timeout 600 npx vitest run --project=storybook --merge-reports --coverage
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if [ ! -f vitest-report.xml ]; then
            echo "vitest failed before producing a report (exit $status)." >&2
            exit $status
          fi
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("vitest-report.xml").getroot()
          suites = root.findall(".//testsuite") if root.tag == "testsuites" else [root]
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          # An empty report is not a passing one: when the browser cannot launch (for example the
          # container image's Playwright release differs from package-lock.json's), vitest runs zero tests
          # and writes a valid, failure-free report that would publish a "0 passed" / 0% coverage badge.
          if total == 0:
              print("vitest-report.xml contains no tests — the run never executed any story.", file=sys.stderr)
              sys.exit(1)
          if failures or errors:
              print(f"{failures} failure(s), {errors} error(s) in vitest-report.xml.", file=sys.stderr)
              sys.exit(1)
          print("vitest didn't exit cleanly, but vitest-report.xml shows every test passed — treating as success.")
          PY

      - name: Frontend coverage summary
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("coverage/coverage-summary.json") as f:
              pct = json.load(f)["total"]["lines"]["pct"]
          print("## Frontend coverage")
          print()
          print(f"**{pct:.2f}%** line coverage.")
          print()
          print("Full HTML report attached as the `frontend-coverage-html` artifact.")
          print()
          print(
              "Low by design today: only Storybook stories under `test-storybook` "
              "count towards this number, and most page-level logic is instead "
              "covered by the Playwright E2E suite (see the `e2e-tests` job), "
              "which this badge doesn't measure."
          )
          PY

      # `Run frontend tests with coverage` above (no `if: always()`) is the pass/fail gate through its
      # exit code; these three steps are reporting and artifact conveniences, so they continue on error.
      - name: Storybook timing
        if: always()
        continue-on-error: true
        run: python3 ../scripts/junit_timing_summary.py vitest-report.xml --title "Storybook" --budget-minutes 8 >> "$GITHUB_STEP_SUMMARY"

      - name: Publish frontend test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always()
        continue-on-error: true
        with:
          name: Frontend test results
          path: frontend/vitest-report.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload frontend coverage report (HTML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        continue-on-error: true
        with:
          name: frontend-coverage-html
          path: frontend/coverage
          retention-days: 14

      - name: Upload frontend coverage/test reports (raw)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        continue-on-error: true
        with:
          name: frontend-test-reports
          path: |
            frontend/coverage/coverage-summary.json
            frontend/vitest-report.xml
          retention-days: 14

  backend-tests:
    name: Backend tests & coverage
    runs-on: ubuntu-latest
    # Runs finish in 30-45 minutes (docker build, 29-41 minutes of pytest at -n 4 over ~3.4k tests, ruff);
    # runner speed varies by ~10 minutes. A healthy run past the ceiling is cancelled mid-pytest (shown as
    # "cancelled", not failed); if it is reached, shard the suite instead of raising it. Without a ceiling
    # a stalled step (see e2e-tests' timeout-minutes comment) sits until someone cancels it.
    timeout-minutes: 75
    permissions:
      # checks: write is for the "Publish backend test results" step (dorny/test-reporter creating a
      # check run). Badge publishing needs contents: write and runs in the publish-badges job.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Pre-builds through buildx so the image uses its own GitHub Actions cache scope (`cache-from`/
      # `cache-to: type=gha`) and layers for an unchanged requirements.txt survive between runs.
      # `load: true` puts the image into the local Docker daemon under the `<compose-project>-backend`
      # name Compose expects (the project name is the directory basename, "container"; see
      # docker-compose.yml), so `docker compose up -d` finds it. e2e-tests builds the same image
      # independently; see the top comment for why.
      - name: Build backend image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          tags: container-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build converter image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./converter
          tags: container-converter:latest
          load: true
          cache-from: type=gha,scope=converter
          cache-to: type=gha,mode=max,scope=converter

      # The dev/test stack (tests/container/docker-compose.yml) is the same one developers run locally and
      # the only one the backend test suite may run against: tests/conftest.py fails unless DATABASE_URL
      # names a database ending in `_test` (docs/decisions.md, "Database: the test suite was wiping the
      # live database"). Only the services pytest needs come up: db and storage are backend's
      # `depends_on`; mailhog is listed explicitly because several tests send mail through it
      # (test_notifications.py, test_digest.py). frontend, mcp-server and keycloak are needed only by
      # e2e-tests. No `--build`: the step above built and cached the backend image.
      # One API process, not the default four: this job only runs pytest inside the container, nothing calls the
      # served API, and four idle processes hold about 1.5 GB that the four pytest workers need (a pytest worker was
      # killed by the out-of-memory killer mid-run, which fails whichever test it was running).
      - name: Start the dev/test stack (backend + its dependencies)
        working-directory: tests/container
        env:
          BACKEND_WORKERS: "1"
        run: docker compose up -d db storage mailhog converter backend

      # Diagnostic only: `docker compose up -d` above fails (exit 1) when a `depends_on:
      # condition: service_healthy` dependency never becomes healthy, so it carries no dependency's logs.
      # This dumps every service's state and logs. `docker inspect .State.Health` is the important call:
      # it carries each healthcheck probe's own stdout, stderr and exit code (for the `storage` service,
      # `wget -qO- http://localhost:9333/cluster/status`), which `docker compose logs` never shows.
      - name: Diagnose dev/test stack on startup failure
        if: failure()
        working-directory: tests/container
        run: |
          docker compose ps -a
          docker compose logs
          echo "--- storage healthcheck probe history ---"
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q storage)" | python3 -m json.tool

      - name: Wait for backend to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: backend $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "backend never became healthy" >&2
          docker compose logs backend
          exit 1

      # `-n 4`: the GitHub-hosted `ubuntu-latest` runner has 4 vCPUs and this step is the largest chunk of
      # CI time. `_pytest_database.py` isolates a database per `PYTEST_XDIST_WORKER` (`_gw0`, `_gw1`, ...)
      # for any worker count.
      # --cov-fail-under is the published figure (95.2%) minus two points, so a real drop fails the build
      # while normal churn does not. Raise it when coverage rises; never lower it to pass a failing run.
      - name: Run backend tests with coverage
        working-directory: tests/container
        run: |
          docker compose exec -T backend python -m pytest -n 4 \
            --cov=app --cov-report=xml --cov-report=term-missing --cov-report=html \
            --cov-fail-under=93.2 \
            --junitxml=pytest-report.xml -q
          docker compose cp backend:/app/coverage.xml ./coverage.xml
          docker compose cp backend:/app/pytest-report.xml ./pytest-report.xml
          docker compose cp backend:/app/htmlcov ./htmlcov

      # Duration and slowest tests in the job summary, so a slower suite is seen on the run that slowed it. The budget is
      # the target, a warning and never a failure (see scripts/junit_timing_summary.py).
      - name: Backend test timing
        if: always()
        continue-on-error: true
        run: python3 scripts/junit_timing_summary.py tests/container/pytest-report.xml --title "Backend tests" --budget-minutes 20 >> "$GITHUB_STEP_SUMMARY"

      - name: Lint backend (ruff)
        working-directory: tests/container
        run: docker compose exec -T backend ruff check .

      # Committed performance results must carry nothing identifying. A CI checkout holds only tracked files, so the
      # whole-directory scan is the right check here (standard library only; no container or git needed).
      - name: Check committed performance results are anonymised
        run: python3 perf/scrub_check.py
      # Fails on any type error; there is no baseline. Fix it in the code.
      - name: Type-check backend (mypy)
        working-directory: tests/container
        run: docker compose exec -T backend python scripts/check_mypy.py

      - name: Converter tests (real Ghostscript and poppler, inside the sandboxed container)
        working-directory: tests/container
        run: docker compose exec -T converter python -m unittest discover -s tests

      # The backup tool's tests need restic, age and pg_dump 16, which only the `backup` image
      # has; REQUIRE_DR_TOOLS makes a missing binary fail the test instead of skipping it, so the
      # tests cannot quietly stop running. Every repo path is mounted read-only (tests that need to write use
      # a temporary directory). They run against the same test database and network as
      # the suite above, after it has finished.
      - name: Backup tool tests (backup image)
        working-directory: tests/container
        run: |
          docker build --target backup -t container-backup:ci ../../backend
          docker run --rm --network container_default \
            -v "$PWD/../../docs:/docs:ro" \
            -v "$PWD/../../scripts:/scripts:ro" \
            -v "$PWD/../../perf:/perf:ro" \
            -v "$PWD/../../observability:/observability:ro" \
            -v "$PWD/../../.githooks:/.githooks:ro" \
            -v "$PWD/../../deployments:/deployments:ro" \
            -v "$PWD/../../docker-compose.profile.yml:/docker-compose.profile.yml:ro" \
            -v "$PWD/../../tests/container/docker-compose.yml:/tests/container/docker-compose.yml:ro" \
            -e REQUIRE_DR_TOOLS=1 \
            -e DATABASE_URL=postgresql://reqtrack:reqtrack@db:5432/reqtrack_test \
            -e JWT_SECRET=test-secret-not-for-production \
            -e APP_SECRET_ENCRYPTION_KEY=test-encryption-key-not-for-production \
            --entrypoint python container-backup:ci \
            -m pytest tests/test_dr_backup.py tests/test_dr_stats.py tests/test_dr_restore.py tests/test_dr_verify.py \
            tests/test_restore_test_harness.py tests/test_dr_schedule.py tests/test_dr_monitoring.py \
            tests/test_perf_runner.py tests/test_perf_dataset.py -q -p no:cacheprovider

      # The backup and restore-test alert rules: syntax, then their unit tests (a failed backup, a stale one, a
      # silent scheduler, a restore-test eight days old), using promtool from the Prometheus image the stack runs.
      - name: Disaster-recovery alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/o:ro" prom/prometheus:v2.54.1 \
            check rules /o/alerts/disaster-recovery.rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability:/o:ro" prom/prometheus:v2.54.1 \
            test rules /o/alerts/tests/disaster-recovery.test.yml

      - name: Backend coverage summary
        working-directory: tests/container
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          rate = float(root.attrib["line-rate"]) * 100
          print("## Backend coverage")
          print()
          print(f"**{rate:.1f}%** line coverage ({root.attrib['lines-covered']}/{root.attrib['lines-valid']} lines).")
          print()
          print("Full HTML report attached as the `backend-coverage-html` artifact.")
          PY

      # continue-on-error on this and the two upload-artifact steps below: pytest's own exit code, on the
      # "Run backend tests with coverage" step above, is the pass/fail gate. These three are reporting
      # conveniences, and a GitHub API or artifact-service failure in one must not fail the job.
      - name: Publish backend test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always()
        continue-on-error: true
        with:
          name: Backend test results
          path: tests/container/pytest-report.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload backend coverage report (HTML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage-html
          path: tests/container/htmlcov
          retention-days: 14

      - name: Upload backend coverage/test reports (raw)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        continue-on-error: true
        with:
          name: backend-test-reports
          path: |
            tests/container/coverage.xml
            tests/container/pytest-report.xml
          retention-days: 14

      - name: Tear down the dev/test stack
        if: always()
        working-directory: tests/container
        run: docker compose down -v

  e2e-tests:
    name: E2E (Playwright) shard ${{ matrix.shard }} of 3
    runs-on: ubuntu-latest
    # The suite is split over three shards, each with a stack and database of its own, so nothing a spec changes on the
    # deployment (the `global-state-mutators` project) can reach another shard. Shard 1 first runs that serial
    # project (about 5 minutes) and then its third of the parallel project; the others run a third each. A shard takes
    # ~9 minutes of setup (docker build x3 + stack startup + seeding) and 11 to 17 of Playwright; the `e2e-suite` job below reports their combined result under the required check name. If a
    # shard is outgrown, raise the count here, in `--shard` and in `e2e-suite`'s comment, never the ceiling.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Without a ceiling a stalled step (an 18-minute apt-get mirror hang is in docs/decisions.md) sits until
    # someone cancels it, instead of failing the run.
    timeout-minutes: 60
    permissions:
      # checks: write is for the "Publish E2E test results" step below
      # (dorny/test-reporter creating a check run).
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fails fast, with an actionable message, if this job's Playwright image
      # tag has drifted from its lockfile — otherwise the browser can't launch
      # and the run silently executes zero tests. See the script's docstring.
      - name: Check Playwright image matches lockfile
        run: python3 "$GITHUB_WORKSPACE/scripts/check-playwright-image-sync.py"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Pre-builds each of tests/container/docker-compose.yml's three buildable images through buildx, so
      # each uses its own GitHub Actions cache scope (`cache-from`/`cache-to: type=gha`) and layers for
      # unchanged dependency files survive between runs. `load: true` puts the image into the local
      # Docker daemon under the `<compose-project>-<service>` name Compose expects (the project name is
      # the directory basename, "container"; see docker-compose.yml), so `docker compose up -d` finds it.
      # backend-tests builds the backend image independently; see the top comment for why.
      - name: Build backend image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          tags: container-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build converter image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./converter
          tags: container-converter:latest
          load: true
          cache-from: type=gha,scope=converter
          cache-to: type=gha,mode=max,scope=converter

      - name: Build frontend image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          tags: container-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build mcp-server image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./mcp-server
          tags: container-mcp-server:latest
          load: true
          cache-from: type=gha,scope=mcp-server
          cache-to: type=gha,mode=max,scope=mcp-server

      # The dev/test stack (db, storage, mailhog, keycloak, backend, frontend, mcp-server) is the same
      # compose file developers run locally, so CI matches the documented environment with no second
      # configuration. No `--build`: the steps above built and cached the images, and `--build` would
      # rebuild them without buildx's GHA cache.
      - name: Start the dev/test stack
        working-directory: tests/container
        run: docker compose up -d

      # `docker compose up -d` fails without per-service logs when a `depends_on: condition: service_healthy`
      # dependency never becomes healthy; see the backend-tests job's identical step.
      - name: Diagnose dev/test stack on startup failure
        if: failure()
        working-directory: tests/container
        run: |
          docker compose ps -a
          docker compose logs
          echo "--- storage healthcheck probe history ---"
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q storage)" | python3 -m json.tool

      - name: Wait for backend to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: backend $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "backend never became healthy" >&2
          docker compose logs backend
          exit 1

      # Needed for the Playwright SSO specs later in this job, but waited on
      # now so a slow Keycloak pull/boot doesn't surface as a confusing
      # failure partway through the E2E run instead of here.
      - name: Wait for Keycloak to become healthy
        working-directory: tests/container
        run: |
          for i in $(seq 1 40); do
            status=$(docker compose ps keycloak --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            echo "attempt $i: keycloak $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "keycloak never became healthy" >&2
          docker compose logs keycloak
          exit 1

      # Restarting the backend right before seeding gives a clean bootstrap-admin state regardless of what
      # `reqtrack_test` held after container startup. The two seed scripts load the fixed datasets the
      # Playwright suite expects: the E2E persona/org/project set most specs are written against, and the
      # demo dataset (demo.admin@example.com etc.) that badge-filters.spec.ts needs. The same sequence is
      # in docs/deployment.md's troubleshooting section.
      - name: Restart backend and reseed test datasets
        working-directory: tests/container
        run: |
          docker compose restart backend
          for _ in $(seq 1 40); do
            status=$(docker compose ps backend --format json | python3 -c "import sys,json; print(json.load(sys.stdin).get('Health','unknown'))")
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker compose exec -T backend python scripts/seed_demo_data.py
          docker compose exec -T backend python scripts/seed_e2e_dataset.py

      # Runs after the E2E dataset is seeded so the full-chain test
      # (list_projects -> list_requirements -> get_requirement ->
      # get_requirement_history) has real data to exercise instead of
      # skipping — see mcp-server/tests/test_server.py.
      - name: Run MCP server tests
        if: matrix.shard == 1
        working-directory: tests/container
        run: docker compose exec -T mcp-server python -m pytest -q

      - name: Lint mcp-server (ruff)
        if: matrix.shard == 1
        working-directory: tests/container
        run: docker compose exec -T mcp-server ruff check .

      - name: Install npm dependencies
        working-directory: tests/playwright
        run: npm ci

      # Lists the suite sharded and unsharded and fails if a test would run in no shard or in two (the shard count and
      # project names are in this file; a change to either could drop a test without any run noticing).
      - name: Every E2E test is in exactly one shard
        if: matrix.shard == 1
        run: python3 scripts/check_playwright_shards.py

      # Only the test run moves into a throwaway container of the Playwright image, through a plain
      # `docker run` against the runner's Docker daemon; the job itself cannot run inside that image
      # because it drives `docker compose` against the host daemon (nesting would be Docker-in-Docker).
      # This keeps `apt-get` out of the job, so a flaky package mirror cannot stall the run.
      # `--network host` lets the container reach the stack on `localhost` like a native
      # `npx playwright test` (playwright.config.ts baseURL, host port mappings in
      # tests/container/docker-compose.yml). The working directory is mounted with its host-installed
      # node_modules (@playwright/test has no native dependencies).
      #
      # `-e CI=true`: `docker run` starts with an empty environment, and playwright.config.ts enables
      # `retries: process.env.CI ? 2 : 0` (for the transient client-side connection stall in
      # docs/decisions.md) only when `CI` is set inside the container.
      #
      # The image tag's version MUST match tests/playwright/package-lock.json's resolved `@playwright/test`
      # version; see the frontend job's `container:` comment, and bump both together.
      # The whole repo is mounted, not only tests/playwright, because e2e-workflows/helpers.ts imports the
      # shared stat-block geometry assertion from frontend/src/testing/.
      - name: Run Playwright E2E suite
        working-directory: tests/playwright
        run: |
          run_playwright() {
            report="$1"; shift
            docker run --rm --network host \
              -e CI=true \
              -e PLAYWRIGHT_JUNIT_OUTPUT_NAME="$report" \
              -v "$(git rev-parse --show-toplevel)":/work -w /work/tests/playwright \
              mcr.microsoft.com/playwright:v1.65.1-noble \
              npx playwright test --reporter=list,junit "$@"
          }
          status=0
          # The serial project that changes deployment-wide settings runs once, in shard 1, before that shard's
          # parallel tests (Playwright would otherwise run it in every shard). The parallel project is sharded.
          if [ "${{ matrix.shard }}" = "1" ]; then
            run_playwright playwright-report-serial.xml --project=global-state-mutators || status=1
          fi
          run_playwright playwright-report.xml --project=default --no-deps --shard=${{ matrix.shard }}/3 || status=1
          exit $status

      # Same continue-on-error reasoning as backend-tests' Publish/Upload
      # steps: "Run Playwright E2E suite" (no if: always()) is the real
      # pass/fail gate via its own exit code; these two are reporting
      # conveniences that must not be able to mask whether it actually ran.
      - name: E2E shard timing
        if: always()
        continue-on-error: true
        run: python3 scripts/junit_timing_summary.py tests/playwright/playwright-report*.xml --title "E2E shard ${{ matrix.shard }}" --budget-minutes 25 >> "$GITHUB_STEP_SUMMARY"

      - name: Publish E2E test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always()
        continue-on-error: true
        with:
          name: E2E (Playwright) test results (shard ${{ matrix.shard }} of 3)
          path: tests/playwright/playwright-report*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        continue-on-error: true
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            tests/playwright/playwright-report*.xml
            tests/playwright/test-results
          retention-days: 14

      - name: Tear down the dev/test stack
        if: always()
        working-directory: tests/container
        run: docker compose down -v

  # The one check the repository requires for the end-to-end suite: it passes only when every shard passed, and keeps
  # the name a ruleset or a branch rule already lists, so splitting the suite changes no rule.
  e2e-suite:
    name: E2E (Playwright) suite
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every E2E shard passed
        env:
          SHARDS: ${{ needs.e2e-tests.result }}
        run: |
          echo "E2E shards: $SHARDS"
          [ "$SHARDS" = "success" ]

  publish-badges:
    name: Publish coverage/test badges
    runs-on: ubuntu-latest
    needs: [frontend, backend-tests]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Normal runs finish in ~10 seconds.
    timeout-minutes: 10
    # Feeds the four shields.io "endpoint" badges at the top of README.md (backend/frontend x coverage and
    # pass-fail count). No external badge service or extra secret: this job's GITHUB_TOKEN pushes small JSON
    # files to a dedicated `badges` branch, which shields.io reads through a raw.githubusercontent.com URL.
    #
    # A dedicated job, not a step in frontend/backend-tests: those run in parallel, and two independent
    # force-pushes to `badges` would race, the second wiping the first's files. Waiting on both through
    # `needs` and publishing once removes the race.
    #
    # The job-level `if` uses `always()` and every step is best-effort: a badge problem never fails the CI
    # signal, and one side being unavailable does not block publishing the other side's badges.
    permissions:
      contents: write
    steps:
      # upload-artifact keeps each artifact's paths relative to the common ancestor of the uploaded paths,
      # so each artifact's root is that directory's contents (no `tests/container/` or `frontend/` prefix).
      - name: Download backend test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: backend-test-reports
          path: backend-reports

      - name: Download frontend test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: frontend-test-reports
          path: frontend-reports

      - name: Generate badge JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def coverage_color(pct: float) -> str:
              if pct >= 90:
                  return "brightgreen"
              if pct >= 75:
                  return "yellow"
              return "red"

          def junit_counts(path: str) -> tuple[int, int] | None:
              try:
                  root = ET.parse(path).getroot()
              except (FileNotFoundError, ET.ParseError):
                  return None
              suites = root.findall(".//testsuite") if root.tag == "testsuites" else [root]
              total = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              return total, total - failures - errors

          def write_badges(
              coverage_name: str, tests_name: str,
              coverage_pct: float | None, counts: tuple[int, int] | None,
          ) -> None:
              # A run that executed zero tests carries no signal; keep the last published badges.
              if counts is not None and counts[0] == 0:
                  return
              if coverage_pct is not None:
                  Path(f"{coverage_name}-coverage-badge.json").write_text(json.dumps({
                      "schemaVersion": 1, "label": f"{coverage_name} coverage",
                      "message": f"{coverage_pct:.1f}%", "color": coverage_color(coverage_pct),
                  }))
              if counts is not None:
                  total, passed = counts
                  all_green = passed == total
                  Path(f"{tests_name}-tests-badge.json").write_text(json.dumps({
                      "schemaVersion": 1, "label": f"{tests_name} tests",
                      "message": f"{passed} passed" if all_green else f"{passed}/{total} passed",
                      "color": "brightgreen" if all_green else "red",
                  }))

          backend_coverage = None
          try:
              backend_coverage = float(ET.parse("backend-reports/coverage.xml").getroot().attrib["line-rate"]) * 100
          except (FileNotFoundError, ET.ParseError, KeyError):
              pass
          write_badges("backend", "backend", backend_coverage, junit_counts("backend-reports/pytest-report.xml"))

          frontend_coverage = None
          try:
              frontend_coverage = json.loads(Path("frontend-reports/coverage/coverage-summary.json").read_text())["total"]["lines"]["pct"]
          except (FileNotFoundError, KeyError):
              pass
          write_badges("frontend", "storybook", frontend_coverage, junit_counts("frontend-reports/vitest-report.xml"))
          PY

      - name: Push badges
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          badge_files=(*-badge.json)
          if [ ${#badge_files[@]} -eq 0 ]; then
            echo "No coverage/test reports available to publish badges from — skipping."
            exit 0
          fi

          workdir="$PWD"
          rm -rf /tmp/badges-publish
          mkdir -p /tmp/badges-publish
          cd /tmp/badges-publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Start from the published branch so a partial run (one side produced no report) updates only
          # its own files and keeps the other side's badges.
          if git fetch -q origin badges:refs/remotes/origin/badges 2>/dev/null && \
             git rev-parse -q --verify refs/remotes/origin/badges >/dev/null; then
            git checkout -q -B badges refs/remotes/origin/badges
          else
            git checkout -q --orphan badges
          fi
          # Removes the superseded frontend-tests badge file.
          git rm -q --ignore-unmatch frontend-tests-badge.json
          cp "$workdir"/*-badge.json .
          git add -A
          git commit -q -m "Update CI badges" --allow-empty
          git push -q -f origin badges:badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # Independent of every test job and cheap (~1-2 minutes); docker-build
    # needs it so a vulnerable dependency stops the images being published.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      # pip-audit resolves the full dependency tree (so a vulnerable
      # transitive package is found, not only the ones named in the file).
      # A finding is fixed by upgrading the package; there is no ignore list.
      - name: Install pip-audit
        run: python3 -m pip install pip-audit==2.10.1

      - name: Audit backend Python dependencies
        run: python3 -m pip_audit -r backend/requirements.txt

      - name: Audit mcp-server Python dependencies
        run: python3 -m pip_audit -r mcp-server/requirements.txt

      - name: Audit converter Python dependencies
        run: python3 -m pip_audit -r converter/requirements.txt

      # --omit=dev: only what ships to users is gated. The frontend bundle is
      # built from these production dependencies; test-only tooling is not.
      - name: Audit frontend npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Playwright npm dependencies
        working-directory: tests/playwright
        run: npm audit --omit=dev --audit-level=high

      # Reported but not gating: the only open finding (`braces`, a build-time glob dependency of
      # Docusaurus) has no patched release, and the published docs image is static files served by
      # nginx that contain none of it. Gate this step (remove continue-on-error) once Docusaurus
      # moves off the vulnerable range.
      - name: Audit documentation site npm dependencies (not gating)
        working-directory: docs/website
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Licence guard (docs/development.md, "Licence guard"): the shipped application must never link a GPL, AGPL or
  # source-available dependency, so a new or changed dependency is judged against scripts/licence_policy.json. The
  # lockfiles are read directly; each Python requirements file is installed afresh so a transitive dependency
  # that changed licence fails here, before an image is built. A failure is fixed by replacing the dependency;
  # only a reviewed exception, with its evidence, goes into the policy.
  licences:
    name: Licence guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the licences of every shipped component
        run: python3 scripts/check_licences.py --live

  cla:
    name: CLA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Maintainer and automation accounts come from the base branch's copy, so a pull request cannot exempt itself;
      # the signatories come from the pull request, because adding the entry is how a contributor signs.
      - name: Check that every commit author signed the CLA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A base branch with no signatories file yet (the pull request that introduces it) trusts only the
          # repository owner, which the event supplies and the pull request cannot change.
          if ! gh api -H "Accept: application/vnd.github.raw" "repos/${REPO}/contents/.github/cla-signatories.json?ref=${BASE_SHA}" > "${RUNNER_TEMP}/base-signatories.json" 2>/dev/null; then
            printf '{"maintainers": ["%s"], "automation": ["dependabot[bot]"], "signatories": []}\n' "${REPO_OWNER}" > "${RUNNER_TEMP}/base-signatories.json"
          fi
          # The person who opened the pull request is authenticated by GitHub; a commit's author is only an attribution
          # (anyone can write another person's email into a commit), so both are checked.
          mapfile -t AUTHORS < <({ echo "${PR_AUTHOR}"; gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" --jq '.[].author.login // ""'; } | sort -u)
          python3 scripts/check_cla.py --base-file "${RUNNER_TEMP}/base-signatories.json" --authors "${AUTHORS[@]}"

  image-scan:
    name: Image build, smoke test & vulnerability scan
    runs-on: ubuntu-latest
    # No `needs`: starts with the test jobs and takes ~5 minutes, so a vulnerable base image or a broken
    # image build fails the run early. docker-build needs it, so a vulnerable image is never published.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Documentation site image, for hosting the docs inside a deployment
      # (HELP_URL). The first build uses a non-default base path and is smoke
      # tested, because a wrong base path is the way this image breaks: the
      # home page would load but every asset and nested page would 404.
      - name: Build docs image for smoke test (base path /docs/)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docs/website
          file: ./docs/website/Dockerfile.prod
          load: true
          push: false
          build-args: |
            DOCS_BASE_URL=/docs/
          tags: docs-smoke:test

      - name: Smoke test docs image
        run: |
          docker run -d --name docs-smoke -p 8081:8080 docs-smoke:test
          for _ in $(seq 1 30); do curl -sf http://localhost:8081/health && break; sleep 1; done
          curl -sf http://localhost:8081/docs/ -o /dev/null
          curl -sf http://localhost:8081/docs/installation-deployment/overview -o /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/docs/no-such-page)
          test "$code" = "404"
          docker rm -f docs-smoke

      # Vulnerability scan of every image before any of them is pushed, so a
      # vulnerable image never reaches the registry a deployment pulls from.
      # The images are built here only to be scanned (build args that only
      # label the image are omitted); docker-build rebuilds them to push. The
      # docs image is the smoke-test build above.
      - name: Build backend image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          load: true
          push: false
          tags: scan-backend:ci

      - name: Build backup image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          target: backup
          load: true
          push: false
          tags: scan-backup:ci

      - name: Build frontend image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          load: true
          push: false
          tags: scan-frontend:ci

      - name: Build mcp-server image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./mcp-server
          load: true
          push: false
          tags: scan-mcp-server:ci

      - name: Build converter image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./converter
          load: true
          push: false
          tags: scan-converter:ci

      # HIGH and CRITICAL findings that have a fix available fail the job: fix
      # them by moving the base image or the dependency, never by an ignore
      # file. `--ignore-unfixed` leaves out only findings with no released fix,
      # which nothing in this repository can remediate; they are re-checked on
      # every run, so one is reported as soon as a fix exists. Trivy is run from
      # its own pinned image rather than a third-party action.
      - name: Scan images for HIGH/CRITICAL vulnerabilities (Trivy)
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        run: |
          status=0
          for image in scan-backend:ci scan-backup:ci scan-frontend:ci scan-mcp-server:ci scan-converter:ci docs-smoke:test; do
            echo "::group::Trivy $image"
            docker run --rm \
              -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY \
              -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln \
              --exit-code 1 --no-progress "$image" || status=1
            echo "::endgroup::"
          done
          exit $status

  restore-test:
    name: Disaster recovery restore test
    runs-on: ubuntu-latest
    # Builds a throwaway source stack, seeds the end-to-end dataset, takes a real backup, restores it into a
    # second throwaway stack and checks the result matches (scripts/restore-test-selfcheck.sh), then proves
    # each check can fail: a deleted row, a deleted object, a wrong encryption key and a damaged repository
    # must all be caught. No `needs`: it builds its own images and shares nothing with the other jobs, so it
    # runs beside them; docker-build needs it, so a backup that cannot be restored is never published.
    # Roughly 20 to 30 minutes (the seed and six restores dominate).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Backup, restore, verify and prove the checks fail
        env:
          DRCHECK_OUTPUT: restore-test-reports
        run: ./scripts/restore-test-selfcheck.sh

      - name: Upload restore-test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        continue-on-error: true
        with:
          name: restore-test-reports
          path: restore-test-reports
          retention-days: 14

  # Computes the release identity once, so every image leg below (and the manifest job) tags and labels with the
  # same SemVer and build date instead of each installing GitVersion and computing its own. No `needs`: it is
  # cheap and the image legs wait for it alongside the test gates.
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      build_date: ${{ steps.builddate.outputs.date }}
    steps:
      # fetch-depth: 0 (full history and tags) lets GitVersion compute the version from the commit graph.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      # GitVersion.yml (repo root) sets `mode: ContinuousDeployment`: every commit on main is a release, so
      # the version increments with each merge without a pushed git tag. `next-version` sets the starting 0.1.0.
      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      # Feeds the APP_VERSION/GIT_SHA/BUILD_DATE build args of the images that
      # report their own build identity (GET /api/v1/system/version, the nav
      # rail's version footer) — otherwise GitVersion's SemVer would only ever
      # live in the image *tag*.
      - name: Determine build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # One leg per image and CPU architecture, each on a runner of that architecture. arm64 is built natively
  # (QEMU emulation is several times slower for the pip and npm builds). Every leg builds on every run,
  # pull requests included, so an architecture-specific build break fails the PR. The arm64 legs also smoke
  # test and scan the image, and only a passing leg pushes its digest, so a broken or vulnerable arm image
  # never receives a tag. Unit, backend and end-to-end tests run on amd64 only; the smoke test is the arm gate.
  #
  # Pushes are by digest (untagged); `docker-publish` assembles the tags once every leg has succeeded.
  # There is no `cache-from/to`: the build args at the top of each Dockerfile change on every commit and
  # invalidate every later layer, so a shared cache never hits.
  docker-build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [frontend, backend-tests, e2e-suite, dependency-scan, licences, image-scan, restore-test, static-analysis, secret-scan, version]
    # Normal runs finish in ~5 minutes; the arm64 backend leg adds the smoke test (a database, migrations, a login).
    timeout-minutes: 30
    # Pushes digests to ghcr.io only when this isn't a pull_request run — a same-repo PR's GITHUB_TOKEN could
    # technically push, but a feature branch has no business publishing to the registry a real deployment pulls
    # from. No extra secret is needed: GITHUB_TOKEN already has `packages: write` (granted below) and ghcr.io
    # accepts it directly.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [backend, backup, frontend, mcp-server, converter, docs]
        include:
          - image: backend
            context: ./backend
            version_args: true
          - image: backup
            context: ./backend
            target: backup
            version_args: true
          - image: frontend
            context: ./frontend
            version_args: true
          - image: mcp-server
            context: ./mcp-server
            reuse: true
          - image: converter
            context: ./converter
            reuse: true
          - image: docs
            context: ./docs/website
            file: ./docs/website/Dockerfile.prod
            reuse: true
    env:
      # Only `main` publishes: a manual run (workflow_dispatch) from any other branch must not retag `latest`.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image that carries no build identity (`reuse`: nothing in it names the release) is published again only when
      # its sources changed. `src-<tree>` is a tag on the published image, named by the git tree of its build context,
      # so an unchanged image keeps its digest: a production host that pulls the new release tag finds the image it
      # already has, downloads nothing and has no extra image to prune. A fixable HIGH or CRITICAL finding in its base
      # image fails the scan jobs, which is what forces the change and a new image.
      - name: Check whether the published image is current
        id: current
        if: env.PUSH == 'true' && matrix.reuse
        env:
          CONTEXT: ${{ matrix.context }}
          REPOSITORY: ghcr.io/${{ github.repository }}-${{ matrix.image }}
        run: |
          tree="$(git rev-parse "HEAD:${CONTEXT#./}")"
          if docker buildx imagetools inspect "$REPOSITORY:src-$tree" > /dev/null 2>&1; then
            echo "The published image for tree $tree is current: it is tagged again, not pushed again."
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the images that declare the build identity ARGs get them; passing an unused build arg is a Docker
      # warning. A multi-line step output keeps one build step for all six images.
      - name: Compose build arguments
        id: args
        env:
          VERSION_ARGS: ${{ matrix.version_args }}
          APP_VERSION: ${{ needs.version.outputs.semver }}
          BUILD_DATE: ${{ needs.version.outputs.build_date }}
        run: |
          {
            echo 'build_args<<BUILD_ARGS_EOF'
            if [ "$VERSION_ARGS" = "true" ]; then
              echo "APP_VERSION=$APP_VERSION"
              echo "GIT_SHA=$GITHUB_SHA"
              echo "BUILD_DATE=$BUILD_DATE"
            fi
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Proves the Dockerfile builds on this architecture. On arm64 the image is also loaded into the runner's
      # Docker so the smoke test and scan below can run it.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.build_args }}
          load: ${{ matrix.arch == 'arm64' }}
          push: false
          tags: smoke-${{ matrix.image }}:ci

      # arm64 only: start the image and exercise it (backend: PostgreSQL, migrations, login, authenticated lists;
      # see the script). Fails the leg, and so the digest push and the manifest job, if the image does not work.
      - name: Smoke test image (arm64)
        if: matrix.arch == 'arm64'
        run: ./scripts/smoke_test_image.sh "${{ matrix.image }}" "smoke-${{ matrix.image }}:ci" arm64

      # The same HIGH/CRITICAL-with-a-fix gate `image-scan` applies to the amd64 images, so an arm64-only
      # finding (a different wheel or package build) also blocks the push.
      - name: Scan image for HIGH/CRITICAL vulnerabilities (Trivy, arm64)
        if: matrix.arch == 'arm64'
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        run: |
          docker run --rm \
            -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln \
            --exit-code 1 --no-progress "smoke-${{ matrix.image }}:ci"

      - name: Push image by digest
        id: push
        if: env.PUSH == 'true' && steps.current.outputs.current != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.build_args }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: env.PUSH == 'true' && steps.current.outputs.current != 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true' && steps.current.outputs.current != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles each image's per-architecture digests into one multi-arch manifest list under the `semVer`, commit
  # SHA and `latest` tags, so `docker compose pull` gets the right image on any host. Runs only when every leg
  # above (including the arm64 smoke tests) passed, and only off pull requests. Verifies both platforms are in
  # the result.
  docker-publish:
    name: Publish multi-arch image tags
    runs-on: ubuntu-latest
    needs: [docker-build, version]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The protected `release` environment (Settings, Environments) is limited to `main` by its branch rule, so a branch
    # that edits this file still cannot reach the registry credentials.
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # The tree of each build context names an image that is not rebuilt (see the check in docker-build).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image built in this run gets its tags from the digests its legs pushed (and, if it is `reuse`, the `src-` tag
      # naming its sources). An image whose legs found it current pushed nothing: its tags are put on the image that already
      # carries `src-<tree>`, so the release tag names the same digest and a host that has it pulls nothing.
      - name: Create and verify manifest lists
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          # The build context of each image (the backup image builds from the backend's).
          context_of() { case "$1" in backup) echo backend ;; docs) echo docs/website ;; *) echo "$1" ;; esac; }
          reuse=" mcp-server converter docs "
          for image in backend backup frontend mcp-server converter docs; do
            repo="$REPOSITORY-$image"
            tree="$(git rev-parse "HEAD:$(context_of "$image")")"
            sources=""
            for file in "$RUNNER_TEMP/digests/digests-$image-"*/*; do
              [ -e "$file" ] && sources="$sources $repo@sha256:$(basename "$file")"
            done
            echo "::group::$image"
            if [ -n "$sources" ]; then
              extra=""
              case "$reuse" in *" $image "*) extra="-t $repo:src-$tree" ;; esac
              # shellcheck disable=SC2086
              docker buildx imagetools create \
                -t "$repo:$SEMVER" -t "$repo:$GITHUB_SHA" -t "$repo:latest" $extra $sources
            else
              case "$reuse" in
                *" $image "*) ;;
                *) echo "::error::$image has no digests and may not reuse a published image"; exit 1 ;;
              esac
              docker buildx imagetools create \
                -t "$repo:$SEMVER" -t "$repo:$GITHUB_SHA" -t "$repo:latest" "$repo:src-$tree"
            fi
            inspected="$(docker buildx imagetools inspect "$repo:$GITHUB_SHA")"
            echo "$inspected"
            for platform in linux/amd64 linux/arm64; do
              echo "$inspected" | grep -q "Platform: *$platform\$" \
                || { echo "::error::$repo:$GITHUB_SHA is missing $platform"; exit 1; }
            done
            echo "::endgroup::"
          done

  # The "Main Branch" ruleset requires a check named exactly "Build, version, and push production container
  # images". This job reports that name, passing only when every image leg and (off pull requests) the
  # manifest job passed, so the ruleset gates the whole image pipeline and a matrix change needs no ruleset edit.
  images-gate:
    name: Build, version, and push production container images
    runs-on: ubuntu-latest
    needs: [version, docker-build, docker-publish]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every image job to have succeeded (publish is skipped on pull requests)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::an image job finished as '$result'"; exit 1 ;;
            esac
          done
          # docker-build must have actually run: a skipped build (an upstream failure) is not a pass.
          [ "${{ needs.docker-build.result }}" = "success" ] \
            || { echo "::error::docker-build did not succeed"; exit 1; }

  docs:
    name: Build documentation website
    runs-on: ubuntu-latest
    # Shares no state with other jobs, so no `needs`. Runs on every push and pull request: `npm run build`
    # enforces onBrokenLinks/onBrokenAnchors: 'throw' (docusaurus.config.ts), so a broken doc link fails
    # before merge.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - name: Check documentation references resolve
        working-directory: .
        run: python3 scripts/check_doc_links.py
      - name: Check comments describe the code
        working-directory: .
        run: python3 scripts/check_comment_style.py
      - name: Check health probes use 127.0.0.1
        working-directory: .
        run: python3 scripts/check_health_probes.py
      - run: npm ci
      - run: npm run typecheck
      # The agent-skill downloads are built from mcp-server/skill and backend/mcp_skill_reference, not committed.
      - name: Build agent-skill downloads
        working-directory: .
        run: python3 mcp-server/scripts/build_skill_zip.py
      - run: npm run build

  docs-deploy:
    name: Deploy documentation website to GitHub Pages
    runs-on: ubuntu-latest
    needs: [docs]
    # Deploys only from main (a push or a manual run), never from a pull request. GitHub Pages must be
    # enabled in the repository settings (source: "GitHub Actions"); until it is, this job fails with a
    # "Pages not enabled" error.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      # A separate job has a separate workspace, so the build output of `docs` is not available here;
      # rebuilding (~1 minute) is simpler than an artifact hand-off (docker-build makes the same trade-off).
      - run: npm ci
      - name: Build agent-skill downloads
        working-directory: .
        run: python3 mcp-server/scripts/build_skill_zip.py
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/website/build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
