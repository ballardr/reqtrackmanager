[tool.ruff]
# Same rationale and settings as backend/pyproject.toml (N-E-04) — kept
# consistent across both Python components rather than each drifting to
# its own style.
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# pytest-asyncio 1.5 warns until the fixture loop scope is stated; "function" is the default it will move to.
asyncio_default_fixture_loop_scope = "function"
