# Override for the performance runner's ISOLATED stack (perf/run_profile.py): merged over docker-compose.yml and run as
# the Compose project `reqtrack-perf`, with a generated env file of throwaway credentials. It makes the stack unable to
# collide with, or reach, a running deployment on the same host:
#   - no published ports at all (stronger than loopback on an ephemeral port): the load generator reaches the backend
#     on the project's own network, and the runner execs into containers, so nothing outside the host can reach it;
#   - no fixed container name (the base file names the storage container, which a second project could not also use);
#   - perf-only image names (reqtrack-perf-*) so a local build can never retag a production image such as `latest`;
#   - email delivery disabled in the application itself and a placeholder SMTP host, so generated records can never
#     send a notification to anyone;
#   - hard CPU and memory caps with no swap, set by the runner from --max-cpus / --max-mem, so an out-of-memory event
#     kills the perf container rather than a neighbour, and reduced CPU shares so production wins a contended core;
#   - PERF_STACK=1, which the dataset generator requires before it writes anything;
#   - PROFILE_MODE, which counts database statements per request for `queries.csv`. With `--profiling cpu|heap` the
#     runner also merges docker-compose.profile.yml (the profile image target, SYS_PTRACE for py-spy, an output volume).
# The frontend and MCP server are not started: the profile measures the API.
services:
  db:
    cpus: ${PERF_DB_CPUS:-1}
    mem_limit: ${PERF_DB_MEM:-1g}
    memswap_limit: ${PERF_DB_MEM:-1g}
    cpu_shares: 256

  storage:
    container_name: !reset null
    # SeaweedFS reserves about 1 GB per volume at the first upload; a throwaway stack does not need the reservation.
    command: >-
      server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1
      -s3 -s3.port=9000 -s3.ip.bind=:: -s3.config=/etc/seaweedfs/s3.json
      -master.volumePreallocate=false
    cpus: ${PERF_STORAGE_CPUS:-0.5}
    mem_limit: ${PERF_STORAGE_MEM:-512m}
    memswap_limit: ${PERF_STORAGE_MEM:-512m}
    cpu_shares: 128

  backend:
    image: ${PERF_BACKEND_IMAGE:-reqtrack-perf-backend:build}
    ports: !reset []
    environment:
      EMAIL_DELIVERY: disabled
      PERF_STACK: "1"
      # Per-route database statement totals (backend/app/profiling.py), written as files in the container and read by
      # the runner with `exec`; no endpoint, so it adds no surface. Cost: one list append per statement.
      PROFILE_MODE: "true"
      PROFILE_OUTPUT_DIR: /tmp/profile
      PERF_USER_PASSWORD: ${PERF_USER_PASSWORD:?generated by the runner}
    volumes:
      - ./perf:/perf:ro
    cpus: ${PERF_BACKEND_CPUS:-2}
    mem_limit: ${PERF_BACKEND_MEM:-3g}
    memswap_limit: ${PERF_BACKEND_MEM:-3g}
    cpu_shares: 512
    healthcheck:
      # A restored dataset is migrated forward on start, which can take minutes at the larger tiers.
      start_period: 600s
      retries: 60

  # The load generator: Locust only, started with `run --rm` (its profile keeps `up` from starting it).
  loadgen:
    image: ${PERF_LOADGEN_IMAGE:-reqtrack-perf-loadgen:build}
    build:
      context: ./perf/loadgen
    profiles: ["loadgen"]
    environment:
      PERF_USER_PASSWORD: ${PERF_USER_PASSWORD:?generated by the runner}
    depends_on:
      backend:
        condition: service_healthy
    cpus: ${PERF_LOADGEN_CPUS:-1}
    mem_limit: ${PERF_LOADGEN_MEM:-1g}
    memswap_limit: ${PERF_LOADGEN_MEM:-1g}
    cpu_shares: 256
