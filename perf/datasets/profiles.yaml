# Dataset profiles for the performance tooling (perf/generate_dataset.py, backend/app/services/perf_dataset).
#
# Everything the generator scales lives here, not in code, so the ratios are a recorded input of every run.
# No populated instance was used to choose these numbers (a real deployment may hold confidential data); they
# are stated synthetic assumptions. The link density is run at three values so results show how sensitive each
# endpoint is to it. Bump `version` when a ratio changes: a snapshot made with an older version is not reused.
version: 2

# Requirements in each project. T0 is sized like the end-to-end seed set; it is generated by the same code as the
# other tiers (the e2e seed script needs fixed credentials the throwaway stack does not have).
tiers:
  T0: 30
  T1: 100
  T2: 1000
  T3: 5000
  T4: 20000

# Records of the other types per requirement (a ratio of 0.3 on 1,000 requirements is 300 records).
ratios:
  actions: 0.3
  comments: 1.5          # review comments on requirements (mean; a few threads are long)
  tags_per_requirement: 1.2
  versions_per_requirement: 2.0   # mean, so one edit per requirement on average; the history tables grow fastest
  tag_vocabulary: 25     # tags defined in each project
  # Records of every other registered type per requirement (the "heavier mix", chosen 2026-10-27: about twice the
  # first proposal, so cross-type views are stressed harder). Compliance is not here: a catalogue of standards per
  # organisation assigned to each project, whose size does not follow the requirement count (see `compliance`).
  records:
    change_request: 0.3
    risk: 0.6
    decision: 0.4
    pain_point: 1.0
    strategy: 0.06
    future_state: 0.04
    guiding_principle: 0.06
    open_question: 0.3
    persona: 0.1
    stakeholder: 0.3
    stakeholder_need: 0.6
    stakeholder_group: 0.06
    engagement: 0.4
    research_finding: 0.6   # 1.5 per engagement
    compliance_evidence: 0.1

# The compliance catalogue (fixed per organisation, not per requirement) and what each project takes from it.
compliance:
  standards_per_org: 5
  requirements_per_standard: 60
  required_action_fraction: 0.15   # requirements that carry a required action
  standards_per_project: 2

# Links between requirements. `mean_degree` is the mean links touching one requirement; the tail is heavy: a few
# hub requirements hold hundreds. `hub_exponent` is the Zipf exponent of the endpoint weights (higher, hubbier).
link_density:
  sparse: {mean_degree: 1}
  typical: {mean_degree: 3}
  dense: {mean_degree: 8}
hub_exponent: 0.6
# Share of a nested project's links that join it to its parent, so a parent's widened views have cross-level links.
cross_level_link_fraction: 0.05

# People in each organisation (one organisation administrator, the rest members of every project in it).
users_per_org: 6

# Breadth profiles vary shape instead of depth. `tier` still sets the requirements in each project.
# `organisations` x `projects_per_org` projects are created; `nesting` replaces projects_per_org with a tree.
breadth:
  single: {organisations: 1, projects_per_org: 1}
  projects-10: {organisations: 1, projects_per_org: 10}
  projects-50: {organisations: 1, projects_per_org: 50}
  projects-200: {organisations: 1, projects_per_org: 200}
  orgs-5: {organisations: 5, projects_per_org: 2}
  orgs-25: {organisations: 25, projects_per_org: 2}
  nested-3x5: {organisations: 1, nesting: {depth: 3, fanout: 5}}
