# Provisional performance budgets (perf/analyse.py checks a bundle against them).
#
# Starting targets, Decided by: User (2026-10-23): interactive single-record and paged-list requests p95 <= 300 ms;
# unpaged or filtered lists p95 <= 1 s up to T2 (T3 and T4 are measured and reported against a relaxed target agreed
# after the first full run); reports, exports and imports p95 <= 30 s. The numbers are a starting point
# (Decided by: Agent for the exact classification below): a first full run may adjust one, but only with the reason and
# the measured value written next to it here, so a slow result is never silently relabelled as acceptable.
version: 1

classes:
  interactive: {p95_ms: 300}
  list: {p95_ms: 1000, tiers: [T0, T1, T2]}
  heavy: {p95_ms: 30000}

# The first rule whose `match` is a substring of the request name decides its class. A request matching no rule is
# reported but not judged against a budget.
rules:
  - {match: "(unpaged)", class: list}
  - {match: "records/requirement/export", class: heavy}
  - {match: "records/requirement/import", class: heavy}
  - {match: "/reports", class: heavy}
  - {match: "(bundle)", class: heavy}
  - {match: "/files", class: heavy}
  - {match: "link-graph", class: interactive}
  - {match: "(status + sort", class: list}
  - {match: "(tag, page)", class: list}
  - {match: "(text search", class: list}
  - {match: "(has comments", class: list}
  - {match: "POST /search", class: list}
  - {match: "project_scope", class: list}
  - {match: "GET /projects/{id}/requirements (page of 50)", class: interactive}
  - {match: "GET /projects/{id}/requirements/{id}", class: interactive}
  - {match: "POST /projects/{id}/requirements", class: interactive}
  - {match: "PUT /projects/{id}/requirements", class: interactive}
  - {match: "GET ", class: interactive}
  - {match: "POST ", class: interactive}

# Requests that return one fixed-size page must not grow with the data: a slope above this (log-log, p95 against
# requirements per project) is a finding by construction even when under budget.
fixed_size_page_max_slope: 0.35
# Anything steeper than this is superlinear.
superlinear_slope: 1.3
flat_slope: 0.25
