# Override for an ISOLATED copy of the stack: the disaster-recovery restore-test (scripts/restore-test.sh) and
# its self-check (scripts/restore-test-selfcheck.sh) run `docker compose -p <throwaway project> -f
# docker-compose.yml -f docker-compose.restore-test.yml`. It makes the project unable to collide with, or
# reach, a running deployment:
#   - no published ports (the checks run inside the containers), so nothing clashes with the real stack and
#     nothing outside the host can reach the scratch copy;
#   - no fixed container name (the base file names the storage container, which a second project could not
#     also use);
#   - email delivery disabled in the application itself (a mistyped SMTP host could otherwise send real mail);
#   - a patient health check: restoring happens on whatever host the test runs on (a small one, with the
#     application, the database and the restore sharing it), so the backend gets minutes, not seconds, to answer;
#   - the bootstrap server administrator is off by default: it would add a user the backup does not hold, so
#     the restored statistics could never match. The self-check turns it on for the source stack it seeds.
# The restore-test also writes a second, generated override that mounts the repository read-only (see
# docs/disaster-recovery.md, "Restore test").
services:
  storage:
    container_name: !reset null
  backend:
    ports: !reset []
    environment:
      EMAIL_DELIVERY: ${RESTORE_TEST_EMAIL_DELIVERY:-disabled}
      SERVER_ADMIN_ENABLED: ${RESTORE_TEST_SERVER_ADMIN_ENABLED:-false}
    healthcheck:
      start_period: 300s
      retries: 30
