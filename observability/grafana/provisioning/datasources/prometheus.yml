# Provisions Prometheus as Grafana's default data source so the bundled dashboards work on first start.
# Loki and Tempo are still added by hand (docs/website/docs/installation-deployment/observability.md).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
