# Loads every dashboard JSON file in /var/lib/grafana/dashboards (mounted from observability/grafana/dashboards).
apiVersion: 1
providers:
  - name: reqtrackmanager
    folder: ReqTrackManager
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
