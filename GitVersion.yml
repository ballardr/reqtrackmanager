# Configures GitVersion (.github/workflows/ci.yml's `version` job) to compute the SemVer tag applied to
# every pushed container image. The repository has one long-lived branch (`main`) and no release branches.
# GitVersion 6 has two separate settings, and both are needed:
#   - `mode: ContinuousDeployment` controls prerelease-label rendering only: it produces a clean `X.Y.Z`
#     on every commit with no prerelease suffix, as a container-image tag needs. It does not increment.
#   - `strategies: [Mainline]` makes every commit on `main` bump the version. The default strategy set
#     (ConfigNextVersion, MergeMessage, TaggedCommit, TrackReleaseBranches, VersionInBranchName) finds
#     nothing to increment from without tags, version-named branches or commit-message bump markers, so
#     ConfigNextVersion would echo `next-version` verbatim on every build.
# `next-version: 0.1.0` is the starting point when no tags exist; GitVersion's default would start at 0.0.1.
mode: ContinuousDeployment
strategies: [Mainline]
next-version: 0.1.0
